<title>The Guarded Stack</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=Instrument+Serif&display=swap">

<style>
:root {
  --ground:#E5E6E2; --panel:#F1F2EE; --well:#D9DBD5; --raise:#FAFBF8;
  --ink:#1B1E20; --ink-dim:#5C6469; --ink-ghost:#A5ACAD; --rule:#C6C9C3;
  --gold:#8A6410; --gold-soft:#C9A44E; --blue:#2F5C87;
  --refuse:#9A3B2E; --allow:#4A7238;
  --shadow:0 1px 0 rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground:#141719; --panel:#1C2023; --well:#0F1214; --raise:#232829;
    --ink:#E6E4DE; --ink-dim:#8A9096; --ink-ghost:#4E5659; --rule:#2A2F33;
    --gold:#D8A54A; --gold-soft:#8C7233; --blue:#6E9BC9;
    --refuse:#C2685C; --allow:#7FA86B;
    --shadow:0 1px 0 rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  --ground:#141719; --panel:#1C2023; --well:#0F1214; --raise:#232829;
  --ink:#E6E4DE; --ink-dim:#8A9096; --ink-ghost:#4E5659; --rule:#2A2F33;
  --gold:#D8A54A; --gold-soft:#8C7233; --blue:#6E9BC9;
  --refuse:#C2685C; --allow:#7FA86B;
  --shadow:0 1px 0 rgba(0,0,0,.4);
}

* { box-sizing:border-box; }
/* Components below set display:flex, which outranks the user-agent rule for
   [hidden]. Without this, every bar the script hides stays on screen empty. */
[hidden] { display:none !important; }
body {
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
.label {
  font-family:"IBM Plex Sans Condensed","Helvetica Neue",sans-serif;
  font-weight:600; font-size:10px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-dim);
}
.serif { font-family:"Instrument Serif",Georgia,serif; font-weight:400; }

/* ---------- shell ---------- */
.machine {
  height:100dvh; min-height:520px; display:grid;
  grid-template-rows:auto auto minmax(0,1fr) auto auto;
  gap:0;
}
.plate {
  display:flex; align-items:baseline; gap:18px; flex-wrap:wrap;
  padding:14px 20px 12px; border-bottom:1px solid var(--rule); background:var(--panel);
}
.plate .name { font-family:"Instrument Serif",Georgia,serif; font-size:27px; line-height:1; letter-spacing:.01em; }
.plate .sub { color:var(--ink-dim); font-size:12px; }
.readouts { margin-left:auto; display:flex; gap:22px; align-items:center; }
.readout { display:flex; flex-direction:column; align-items:flex-end; gap:1px; }
.readout .v { font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:.02em; }
.readout.fuel .v { color:var(--blue); }
.readout.legal .v { color:var(--gold); }
.badge { font-size:11px; letter-spacing:.02em; padding:3px 8px; border:1px solid var(--rule); border-radius:2px; color:var(--ink-dim); white-space:nowrap; }
.badge.ok { color:var(--allow); border-color:color-mix(in srgb,var(--allow) 45%,transparent); }
.badge.bad { color:var(--refuse); border-color:color-mix(in srgb,var(--refuse) 55%,transparent); }

.keys {
  padding:9px 20px; border-top:1px solid var(--rule); background:var(--panel);
  display:flex; gap:16px; flex-wrap:wrap; align-items:center;
  font-size:11px; color:var(--ink-dim);
}
.keys kbd {
  font-family:inherit; font-size:11px; padding:1px 5px; margin-right:5px;
  border:1px solid var(--rule); border-bottom-width:2px; border-radius:3px;
  background:var(--raise); color:var(--ink);
}

/* ---------- tape ---------- */
.tape-row { padding:10px 20px; border-bottom:1px solid var(--rule); display:flex; align-items:center; gap:14px; background:var(--well); }
.tape-row .label { flex:none; }
.tape { flex:1; min-width:0; overflow-x:auto; display:flex; align-items:center; gap:2px; padding:2px 0 6px; scrollbar-width:thin; }
.chip { flex:none; padding:3px 9px; border-radius:2px; border:1px solid transparent; white-space:nowrap; font-size:13px; }
.chip.done { color:var(--ink); background:var(--raise); border-color:var(--rule); }
.chip.pending { color:var(--ink-ghost); }
.chip.blocked { color:var(--refuse); border-color:color-mix(in srgb,var(--refuse) 55%,transparent); background:color-mix(in srgb,var(--refuse) 10%,transparent); }
.caret { flex:none; width:2px; align-self:stretch; background:var(--gold); border-radius:1px; margin:0 1px; animation:blink 1.1s steps(2,start) infinite; }
@keyframes blink { 50% { opacity:.25; } }
.tape .empty { color:var(--ink-ghost); font-size:12px; }
.reason { flex:none; color:var(--refuse); font-size:12px; }

/* ---------- bench ---------- */
.bench { display:grid; grid-template-columns:minmax(190px,1fr) minmax(0,1.55fr) minmax(230px,.95fr); min-height:0; }
.col { min-height:0; display:flex; flex-direction:column; border-right:1px solid var(--rule); }
.col:last-child { border-right:none; }
.col > .head { padding:9px 16px 7px; border-bottom:1px solid var(--rule); display:flex; align-items:baseline; gap:8px; }
.col > .body { flex:1; min-height:0; overflow-y:auto; padding:12px 16px 16px; scrollbar-width:thin; }

/* stack cells */
.cells { display:flex; flex-direction:column-reverse; gap:5px; align-items:stretch; }
.cell {
  display:flex; align-items:baseline; gap:9px; padding:6px 9px; border-radius:2px;
  background:var(--raise); border:1px solid var(--rule); border-left:3px solid var(--rule);
}
.cell .d { flex:none; font-size:10px; letter-spacing:.1em; color:var(--ink-dim); text-transform:uppercase; min-width:26px; }
.cell .v { overflow-wrap:anywhere; }
.cell.top { border-left-color:var(--gold); }
.cell.top .d { color:var(--gold); }
.cell.long .v { font-size:11.5px; line-height:1.35; }
.void { color:var(--ink-ghost); font-size:12px; padding:6px 2px; }

/* ghosts */
.ghosts { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px; align-items:start; }
.ghost { min-width:0; }
.ghost .gh { display:flex; align-items:baseline; gap:7px; padding-bottom:7px; margin-bottom:8px; border-bottom:1px solid var(--rule); }
.ghost .gn { font-weight:600; color:var(--ink-dim); }
.ghost.pick .gn { color:var(--gold); }
.ghost .ge { font-size:10.5px; color:var(--ink-ghost); }
.ghost .cell { background:transparent; border-color:color-mix(in srgb,var(--rule) 60%,transparent); border-left-color:color-mix(in srgb,var(--rule) 60%,transparent); color:var(--ink-ghost); }
.ghost .cell .d { color:var(--ink-ghost); }
.ghost .cell.new { border-left-color:var(--gold-soft); color:var(--ink-dim); }
.ghost .cell.new .d { color:var(--gold-soft); }

/* palette */
.filterline { display:flex; align-items:center; gap:8px; padding:0 16px; border-bottom:1px solid var(--rule); background:var(--well); }
.filterline .arrow { color:var(--gold); }
#entry {
  flex:1; min-width:0; border:0; outline:0; background:transparent; color:var(--ink);
  font:inherit; padding:11px 0; caret-color:var(--gold);
}
#entry::placeholder { color:var(--ink-ghost); }
.oplist { display:flex; flex-direction:column; gap:1px; }
.op { display:flex; align-items:baseline; gap:10px; padding:5px 9px; border-left:3px solid transparent; border-radius:2px; cursor:pointer; }
.op .n { font-weight:500; min-width:56px; }
.op .e { font-size:11px; color:var(--ink-ghost); overflow-wrap:anywhere; }
.op.sel { background:var(--raise); border-left-color:var(--gold); }
.op.sel .n { color:var(--gold); }
.op.refused { cursor:default; }
.op.refused .n { color:var(--ink-ghost); text-decoration:line-through; text-decoration-color:color-mix(in srgb,var(--refuse) 60%,transparent); }
.op.refused .e { color:var(--refuse); opacity:.75; }
.grouphead { padding:11px 0 4px; }
.grouphead:first-child { padding-top:0; }

/* ---------- browser ---------- */
.browser { min-height:0; overflow-y:auto; padding:18px 20px 24px; scrollbar-width:thin; }
.browser .intro { max-width:64ch; color:var(--ink-dim); font-size:12.5px; margin:0 0 18px; line-height:1.6; }
.browser .intro b { color:var(--ink); font-weight:500; }
.cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:1px; background:var(--rule); border:1px solid var(--rule); }
.card { background:var(--panel); padding:12px 15px 14px; cursor:pointer; border-left:3px solid transparent; display:flex; flex-direction:column; gap:5px; }
.card .t { font-family:"Instrument Serif",Georgia,serif; font-size:20px; line-height:1.2; text-wrap:balance; }
.card .p { font-size:12px; color:var(--gold); overflow-wrap:anywhere; }
.card .p.blank { color:var(--ink-ghost); }
.card .n { font-family:"IBM Plex Sans Condensed","Helvetica Neue",sans-serif; font-size:12.5px; color:var(--ink-dim); line-height:1.45; }
.card.sel { background:var(--raise); border-left-color:var(--gold); }
.browser .none { color:var(--ink-ghost); font-size:12.5px; }

@media (max-width:880px) {
  .machine { height:auto; min-height:100dvh; }
  .bench { grid-template-columns:1fr; }
  .col { border-right:none; border-bottom:1px solid var(--rule); }
  .col > .body { overflow-y:visible; }
  .readouts { width:100%; margin-left:0; justify-content:flex-start; }
}
@media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none !important; transition:none !important; } }
:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
/* ---------- additions for quotations, PBE and the essay ---------- */
.chip.sym { color:var(--blue); }
.tape .delta { flex:none; font-size:10px; color:var(--ink-ghost); margin-left:2px; }

/* PBE strip: the same program on every input */
.pbe { border-top:1px solid var(--rule); background:var(--well); padding:8px 20px 9px;
  display:flex; align-items:flex-start; gap:14px; overflow-x:auto; }
.pbe .label { flex:none; padding-top:3px; }
.pbe .rows { display:flex; gap:18px; flex-wrap:wrap; }
.pbe .row { display:flex; align-items:baseline; gap:8px; font-size:12.5px; white-space:nowrap; }
.pbe .row .in { color:var(--ink-dim); }
.pbe .row .arrow { color:var(--ink-ghost); }
.pbe .row .out { color:var(--ink); }
.pbe .row.bad .out { color:var(--refuse); }
.pbe .row.here { border-bottom:2px solid var(--gold); }

/* browser groups */
.groupname { grid-column:1/-1; background:var(--ground); padding:13px 2px 5px;
  font-family:"IBM Plex Sans Condensed",sans-serif; font-weight:600; font-size:10px;
  letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint); }
.card.essay { border-left-color:var(--blue); }
.card.essay .t { color:var(--blue); }

/* essay panel */
.essay-panel { min-height:0; overflow-y:auto; padding:26px 20px 40px; scrollbar-width:thin; }
.essay-panel .inner { max-width:66ch; }
.essay-panel h2 { font-family:"Instrument Serif",Georgia,serif; font-weight:400;
  font-size:30px; line-height:1.15; margin:0 0 14px; }
.essay-panel p { margin:0 0 14px; font-family:"IBM Plex Sans Condensed",sans-serif;
  font-size:15px; line-height:1.6; color:var(--ink-dim); }
.essay-panel p b { color:var(--ink); font-weight:600; }
.essay-panel .opt { border:1px solid var(--rule); border-left-width:3px; border-radius:2px;
  padding:12px 15px; margin:0 0 14px; background:var(--panel); }
.essay-panel .opt.no { border-left-color:var(--refuse); }
.essay-panel .opt.yes { border-left-color:var(--allow); }
.essay-panel .opt h3 { margin:0 0 6px; font-size:13px; font-weight:600; letter-spacing:.01em; }
.essay-panel .opt p { margin:0; font-size:14px; }
.essay-panel code { font-family:"IBM Plex Mono",monospace; font-size:.9em;
  background:var(--raise); padding:1px 5px; border-radius:3px; color:var(--ink); }
.essay-panel table { border-collapse:collapse; width:100%; margin:4px 0 16px;
  font-family:"IBM Plex Mono",monospace; font-size:12.5px; font-variant-numeric:tabular-nums; }
.essay-panel th, .essay-panel td { text-align:right; padding:5px 10px;
  border-bottom:1px solid var(--rule); }
.essay-panel th:first-child, .essay-panel td:first-child { text-align:left; }
.essay-panel th { font-family:"IBM Plex Sans Condensed",sans-serif; font-size:10px;
  letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); }
.essay-panel .runit { margin-top:6px; font-size:13px; color:var(--ink-dim); }
</style>

<script>
"use strict";

/* ==== PORTABLE MACHINE START ==== */
/* Everything between the START and END markers is extracted verbatim by
   tests/test_stack_machine_explorer.py and replayed under node. Keep the
   markers on their own lines.

   It replays a fixture generated by the Python core on load; the badge in
   the header is red if this port and the core ever disagree. */

const Int  = v => ({ t:"int",  v });          // v is a BigInt
const Bool = v => ({ t:"bool", v });
const Sym  = name => ({ t:"sym", name });     // an op's name, as a value
const Lst  = items => ({ t:"list", items });
const NIL = Lst([]), TRUE = Bool(true), FALSE = Bool(false), ZERO = Int(0n), ONE = Int(1n);

const DEFAULT_FUEL_LIMIT = 100000;
const MAX_QUOTATION_DEPTH = 32;

function valueKey(v) {
  if (v.t === "int")  return ["int", v.v.toString()];
  if (v.t === "bool") return ["bool", v.v];
  if (v.t === "sym")  return ["sym", v.name];
  return ["list", v.items.map(valueKey)];
}
const keyOf = v => JSON.stringify(valueKey(v));
const same  = (a, b) => keyOf(a) === keyOf(b);

function fmt(v) {
  if (v.t === "int")  return v.v.toString();
  if (v.t === "bool") return v.v ? "true" : "false";
  if (v.t === "sym")  return v.name;
  if (v.items.length === 0) return "nil";
  return "(" + v.items.map(fmt).join(" ") + ")";

const fmtStack = st => st.length ? "[ " + st.map(fmt).join(" ") + " ]" : "[]";

function parseStack(text) {
  const tokens = text.replace(/\(/g, " ( ").replace(/\)/g, " ) ")
                     .replace(/\[/g, " ").replace(/\]/g, " ").split(/\s+/).filter(Boolean);

    if (tok === "false") return FALSE;

    return Sym(tok);
  };
  const stack = [];
  while (tokens.length) stack.push(readValue(tokens.shift()));
  return stack;
}

function floorDiv(a, b) {           // Python's // on integers
  let q = a / b;
  if (a % b !== 0n && (a < 0n) !== (b < 0n)) q -= 1n;
  return q;
}

const literal = (name, value) => ({
  name, group:"literals", effect:`( -- ${name} )`,
  guard: () => null,
  apply: c => [[...c.stack, value], 1],
});

const intBinary = (name, combine, extra) => ({
  name, group:"arithmetic", effect:"( a b -- c )",
  guard: c => {
    const r = needs(c, 2); if (r !== null) return r;
    const a = peek(c, 1), b = peek(c, 0);
    if (a.t !== "int" || b.t !== "int") return "top two values are not both integers";
    return extra ? extra(a.v, b.v) : null;
  },
  apply: c => [[...c.stack.slice(0, -2), Int(combine(peek(c,1).v, peek(c,0).v))], 1],
});

const plumbing = (name, effect, n, rearrange) => ({
  name, group:"plumbing", effect,
  guard: c => needs(c, n),
  apply: c => [rearrange(c), 1],
});

const FIRST_ORDER = [
  literal("0", ZERO), literal("1", ONE), literal("nil", NIL),
  literal("true", TRUE), literal("false", FALSE),

  plumbing("dup",  "( a -- a a )",     1, c => [...c.stack, peek(c,0)]),
  plumbing("swap", "( a b -- b a )",   2, c => [...c.stack.slice(0,-2), peek(c,0), peek(c,1)]),
  plumbing("drop", "( a -- )",         1, c => c.stack.slice(0,-1)),
  plumbing("over", "( a b -- a b a )", 2, c => [...c.stack, peek(c,1)]),

  { name:"cons", group:"structure", effect:"( lst a -- lst' )",
    guard: c => {
      const r = needs(c, 2); if (r !== null) return r;
      return peek(c,1).t !== "list" ? "second value is not a list" : null;
    },
    apply: c => [[...c.stack.slice(0,-2), Lst([peek(c,0), ...peek(c,1).items])], 1] },

  { name:"uncons", group:"structure", effect:"( lst -- tail head )",
    guard: c => {
      const r = needs(c, 1); if (r !== null) return r;
      const t = peek(c,0);
      if (t.t !== "list") return "top is not a list";
      return t.items.length === 0 ? "list is empty" : null;
    },
    apply: c => {
      const t = peek(c,0);
      return [[...c.stack.slice(0,-1), Lst(t.items.slice(1)), t.items[0]], 1];
    } },

  { name:"null?", group:"structure", effect:"( lst -- bool )",
    guard: c => {
      const r = needs(c, 1); if (r !== null) return r;
      return peek(c,0).t !== "list" ? "top is not a list" : null;
    },
    apply: c => [[...c.stack.slice(0,-1), Bool(peek(c,0).items.length === 0)], 1] },

  intBinary("add", (a,b) => a + b),
  intBinary("sub", (a,b) => a - b),
  intBinary("mul", (a,b) => a * b),
  intBinary("div", floorDiv, (a,b) => b === 0n ? "division by zero" : null),

  { name:"eq?", group:"predicates", effect:"( a b -- bool )",
    guard: c => needs(c, 2),
    apply: c => [[...c.stack.slice(0,-2), Bool(same(peek(c,1), peek(c,0)))], 1] },

  { name:"lt?", group:"predicates", effect:"( a b -- bool )",
    guard: c => {
      const r = needs(c, 2); if (r !== null) return r;
      const a = peek(c,1), b = peek(c,0);
      return (a.t !== "int" || b.t !== "int") ? "top two values are not both integers" : null;
    },
    apply: c => [[...c.stack.slice(0,-2), Bool(peek(c,1).v < peek(c,0).v)], 1] },
];

/* ---------------------------------------------------------- running code */

const remainingFuel = c =>
  Math.max(0, (c.fuelLimit == null ? DEFAULT_FUEL_LIMIT : c.fuelLimit) - c.fuel);

/* Apply one op to a bare stack under a budget, or return why it cannot. */
function stepRaw(op, stack, budget, depth) {
  if (budget <= 0) return "out of fuel";
  if (op.run) return op.run(stack, budget, depth);
  const c = { stack, fuel:0, fuelLimit:null };
  const reason = op.guard(c);
  if (reason !== null) return reason;
  return op.apply(c);
}

/* Run a quotation body against a stack, or return the reason it stopped.
   A body item that is a Sym names an op; anything else is a value to push. */
function runBody(body, stack, budget, depth) {
  if (depth > MAX_QUOTATION_DEPTH) return "quotation nested too deep";
  let cost = 0;
  for (const item of body) {
    if (cost >= budget) return "out of fuel";
    if (item.t === "sym") {
      const op = OP_BY_NAME.get(item.name);
      if (!op) return `unknown op '${item.name}'`;
      const outcome = stepRaw(op, stack, budget - cost, depth + 1);
      if (typeof outcome === "string") {
        return outcome.startsWith(op.name) ? outcome : `${op.name}: ${outcome}`;
      }
      stack = outcome[0];
      cost += outcome[1];
    } else {
      stack = [...stack, item];
      cost += 1;
    }
  }
  return [stack, cost];
}

const quotations = (stack, count) => {
  if (stack.length < count) return `needs ${count} value(s), stack has ${stack.length}`;
  const top = stack.slice(stack.length - count);
  for (const v of top) if (v.t !== "list") return "expects a quotation on top";
  return top;
};

const oneResult = (outcome, wantBool) => {
  if (typeof outcome === "string") return outcome;
  const [stack, cost] = outcome;
  if (stack.length !== 1) return `body must leave exactly one value, left ${stack.length}`;
  if (wantBool && stack[0].t !== "bool") return "body must leave a boolean";
  return [stack[0], cost];
};

function runI(stack, budget, depth) {
  const got = quotations(stack, 1);
  if (typeof got === "string") return got;
  const outcome = runBody(got[0].items, stack.slice(0,-1), budget - 1, depth + 1);
  if (typeof outcome === "string") return outcome;
  return [outcome[0], outcome[1] + 1];
}

function runDip(stack, budget, depth) {
  const got = quotations(stack, 1);
  if (typeof got === "string") return got;
  if (stack.length < 2) return `needs 2 value(s), stack has ${stack.length}`;
  const kept = stack[stack.length - 2];
  const outcome = runBody(got[0].items, stack.slice(0,-2), budget - 1, depth + 1);
  if (typeof outcome === "string") return outcome;
  return [[...outcome[0], kept], outcome[1] + 1];
}

function runMap(stack, budget, depth) {
  const got = quotations(stack, 1);
  if (typeof got === "string") return got;
  if (stack.length < 2 || stack[stack.length-2].t !== "list") return "second value is not a list";
  const body = got[0].items, source = stack[stack.length-2];
  const out = []; let cost = 1;
  for (const item of source.items) {
    const r = oneResult(runBody(body, [item], budget - cost, depth + 1), false);
    if (typeof r === "string") return r;
    out.push(r[0]); cost += r[1];
    if (cost >= budget) return "out of fuel";
  }
  return [[...stack.slice(0,-2), Lst(out)], cost];
}

function runFilter(stack, budget, depth) {
  const got = quotations(stack, 1);
  if (typeof got === "string") return got;
  if (stack.length < 2 || stack[stack.length-2].t !== "list") return "second value is not a list";
  const body = got[0].items, source = stack[stack.length-2];
  const out = []; let cost = 1;
  for (const item of source.items) {
    const r = oneResult(runBody(body, [item], budget - cost, depth + 1), true);
    if (typeof r === "string") return r;
    if (r[0].v) out.push(item);
    cost += r[1];
    if (cost >= budget) return "out of fuel";
  }
  return [[...stack.slice(0,-2), Lst(out)], cost];
}

function runFold(stack, budget, depth) {
  const got = quotations(stack, 1);
  if (typeof got === "string") return got;
  if (stack.length < 3 || stack[stack.length-3].t !== "list") return "third value is not a list";
  const body = got[0].items, source = stack[stack.length-3];
  let acc = stack[stack.length-2], cost = 1;
  for (const item of source.items) {
    const r = oneResult(runBody(body, [acc, item], budget - cost, depth + 1), false);
    if (typeof r === "string") return r;
    acc = r[0]; cost += r[1];
    if (cost >= budget) return "out of fuel";
  }
  return [[...stack.slice(0,-3), acc], cost];
}

function runIfte(stack, budget, depth) {
  const got = quotations(stack, 3);
  if (typeof got === "string") return got;
  const [cond, then, otherwise] = got;
  const rest = stack.slice(0, -3);
  let outcome = runBody(cond.items, rest, budget - 1, depth + 1);
  if (typeof outcome === "string") return outcome;
  const [tested, cost] = outcome;
  if (!tested.length || tested[tested.length-1].t !== "bool")
    return "condition must leave a boolean on top";
  const chosen = tested[tested.length-1].v ? then : otherwise;
  outcome = runBody(chosen.items, rest, budget - cost - 1, depth + 1);
  if (typeof outcome === "string") return outcome;
  return [outcome[0], outcome[1] + cost + 1];
}

const codeOp = (name, group, effect, run) => ({
  name, group, effect, run,
  guard: () => null,
  apply: c => [c.stack, 1],
});

const CORE_OPS = [
  ...FIRST_ORDER,
  codeOp("dip", "plumbing", "( x q -- ... x )", runDip),
  { name:"quote", group:"quotation", effect:"( a -- (a) )",
    guard: c => needs(c, 1),
    apply: c => [[...c.stack.slice(0,-1), Lst([peek(c,0)])], 1] },
  { name:"cat", group:"quotation", effect:"( (a) (b) -- (a b) )",
    guard: c => {
      const r = needs(c, 2); if (r !== null) return r;
      return (peek(c,1).t !== "list" || peek(c,0).t !== "list")
        ? "both values must be quotations" : null;
    },
    apply: c => [[...c.stack.slice(0,-2), Lst([...peek(c,1).items, ...peek(c,0).items])], 1] },
  codeOp("i", "quotation", "( q -- ... )", runI),
  codeOp("map", "combinators", "( lst q -- lst' )", runMap),
  codeOp("filter", "combinators", "( lst q -- lst' )", runFilter),
  codeOp("fold", "combinators", "( lst acc q -- x )", runFold),
  codeOp("ifte", "combinators", "( qc qt qf -- ... )", runIfte),
];

/* One symbol per core op -- including the combinators and i. Without symbols
   for those, nothing can call itself, every program terminates, and the fuel
   guard could never fire. */
const symbolOp = name => ({
  name: `'${name}`, group: "symbols", effect: `( -- ${name} )`,
  guard: () => null,
  apply: c => [[...c.stack, Sym(name)], 1],
});

const OPS = [...CORE_OPS, ...CORE_OPS.map(op => symbolOp(op.name))];
const OP_BY_NAME = new Map(OPS.map(op => [op.name, op]));
const GROUPS = ["literals","plumbing","structure","arithmetic","predicates",
                "quotation","combinators","symbols"];

/* Ops that run code cannot know their own legality without running, so guard
   and apply share one attempt. */
function opGuard(op, c) {
  if (c.fuelLimit != null && c.fuel >= c.fuelLimit) return "out of fuel";
  if (!op.run) return op.guard(c);
  const outcome = op.run(c.stack, remainingFuel(c), 0);
  return typeof outcome === "string" ? outcome : null;
}
function opApply(op, c) {
  if (!op.run) return op.apply(c);
  const outcome = op.run(c.stack, remainingFuel(c), 0);
  if (typeof outcome === "string") throw new Error(outcome);
  return outcome;
}

const legalOps  = c => OPS.filter(op => opGuard(op, c) === null);
const legalMask = c => OPS.map(op => opGuard(op, c) === null);
const maskString = c => legalMask(c).map(b => b ? "1" : "0").join("");

function runProgram(program, start) {
  let c = { stack: start ? [...start] : [], fuel:0, fuelLimit:null };
  const configs = [c];
  let blocked = null;
  for (let i = 0; i < program.length; i++) {
    const reason = opGuard(program[i], c);
    if (reason !== null) { blocked = { index:i, reason }; break; }
    const [stack, cost] = opApply(program[i], c);
    c = { stack, fuel: c.fuel + cost, fuelLimit: c.fuelLimit };
    configs.push(c);
  }
  return { configs, blocked };
}

const parse = text => text.split(/\s+/).filter(Boolean).map(n => OP_BY_NAME.get(n));

/* ---------------------- conformance against the core ------------------ */

const FIXTURE = JSON.parse(document.getElementById("conformance").textContent);

function checkConformance() {
  let checks = 0;
  const fails = [];
  const note = m => { if (fails.length < 4) fails.push(m); };
  // A port that throws must report a failure, not vanish. Every check below
  // runs inside this guard so a crash is a red badge rather than a blank one.
  try {
    return checkAll(checks, fails, note);
  } catch (err) {
    fails.push(`port threw: ${err && err.message ? err.message : err}`);
    return { checks, fails };
  }
}

function checkAll(checks, fails, note) {

  FIXTURE.ops.forEach((spec, i) => {
    checks++;
    if (!OPS[i] || OPS[i].name !== spec.name || OPS[i].group !== spec.group ||
        OPS[i].effect !== spec.effect) note(`op ${i} (${spec.name})`);
  });
  checks++;
  if (OPS.length !== FIXTURE.ops.length) note("op count");

  for (const ex of FIXTURE.examples) {
    const start = parseStack(ex.inputs[0]);
    checks++;
    if (fmtStack(start) !== ex.input_stacks[0]) note(`${ex.title} input parse`);
    const { configs } = runProgram(parse(ex.program), start);
    ex.trace.forEach((row, i) => {
      checks += 3;
      const c = configs[i];
      if (!c) { note(`${ex.title} step ${i} missing`); return; }
      if (fmtStack(c.stack) !== row.stack) note(`${ex.title} step ${i} stack`);
      if (c.fuel !== row.fuel) note(`${ex.title} step ${i} fuel`);
      if (maskString(c) !== row.mask) note(`${ex.title} step ${i} mask`);
    });
    if (ex.results) {
      ex.inputs.forEach((source, n) => {
        checks++;
        const out = runProgram(parse(ex.program), parseStack(source));
        const last = out.configs[out.configs.length - 1];
        if (out.blocked || fmtStack(last.stack) !== ex.results[n])
          note(`${ex.title} input ${n}`);
      });
    }
  }

  for (const w of FIXTURE.walks) {
    const { configs, blocked } = runProgram(parse(w.program), []);
    const c = configs[configs.length - 1];
    checks += 3;
    if (blocked) note(`walk blocked: ${w.program}`);
    if (fmtStack(c.stack) !== w.stack) note(`walk stack: ${w.program}`);
    if (c.fuel !== w.fuel) note(`walk fuel: ${w.program}`);
    if (maskString(c) !== w.mask) note(`walk mask: ${w.program}`);
  }
  return { checks, fails };
}
/* ==== PORTABLE MACHINE END ==== */

/* ======================================================================
   The explorer
   ====================================================================== */

const el = id => document.getElementById(id);
const entry = el("entry");

const EXAMPLES = FIXTURE.examples.map(e => ({
  group: e.group, kind: e.kind, title: e.title, program: e.program, note: e.note,
  inputs: e.inputs, inputStacks: e.input_stacks,
}));

const state = {
  view: "browser",          // browser | editor | essay
  filter: "",
  pick: 0,
  program: [],
  start: [],
  inputs: [""],
  pos: 0,
  title: "", note: "", group: "",
  opIndex: 0,
  ghostNames: [],
  showRefused: false,
};

let cache = { configs: [{ stack: [], fuel: 0, fuelLimit: null }], blocked: null };

const recompute = () => { cache = runProgram(state.program, state.start); };
const maxPos = () => cache.configs.length - 1;
const current = () => cache.configs[Math.min(state.pos, maxPos())];

/* Guard evaluation now runs code, so memoise the legal set per stack. */
const maskCache = new Map();
function legalHere(config) {
  const key = config.stack.map(keyOf).join("|") + "#" + config.fuel;
  let hit = maskCache.get(key);
  if (!hit) {
    hit = legalOps(config);
    if (maskCache.size > 4000) maskCache.clear();
    maskCache.set(key, hit);
  }
  return hit;
}

function matches(list, filter) {
  if (!filter) return list;
  const f = filter.toLowerCase();
  const starts = list.filter(x => x.name.toLowerCase().startsWith(f));
  return starts.length ? starts : list.filter(x => x.name.toLowerCase().includes(f));
}
const filteredLegal = () => matches(legalHere(current()), state.filter);

function reroll() {
  const pool = filteredLegal();
  const selected = pool[state.opIndex];
  const rest = pool.filter(op => op !== selected);
  for (let i = rest.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [rest[i], rest[j]] = [rest[j], rest[i]];
  }
  const chosen = selected ? [selected, ...rest.slice(0, 2)] : rest.slice(0, 3);
  state.ghostNames = chosen.map(op => op.name);
}

/* ---------------------------- rendering ------------------------------- */

const esc = s => String(s).replace(/[&<>]/g, ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[ch]));

function cellsHtml(stack, ghostFrom) {
  if (!stack.length) return `<div class="void">empty stack</div>`;
  const keys = stack.map(keyOf);
  let shared = 0;
  if (ghostFrom) {
    const base = ghostFrom.map(keyOf);
    while (shared < keys.length && shared < base.length && keys[shared] === base[shared]) shared++;
  }
  return `<div class="cells">` + stack.map((v, i) => {
    const text = fmt(v);
    const depth = stack.length - 1 - i;
    const cls = ["cell"];
    if (depth === 0) cls.push("top");
    if (text.length > 22) cls.push("long");
    if (ghostFrom && i >= shared) cls.push("new");
    const tag = depth === 0 ? "top" : String(depth);
    return `<div class="${cls.join(" ")}"><span class="d">${tag}</span><span class="v">${esc(text)}</span></div>`;
  }).join("") + `</div>`;
}

function renderTape() {
  const row = el("tape-row");
  if (state.view !== "editor") { row.hidden = true; return; }
  row.hidden = false;
  const parts = [];
  if (!state.program.length) parts.push(`<span class="empty">nothing yet &mdash; type an op below and press Enter</span>`);
  state.program.forEach((op, i) => {
    if (i === state.pos) parts.push(`<span class="caret"></span>`);
    const done = i < state.pos;
    const bad = cache.blocked && cache.blocked.index === i;
    const sym = op.group === "symbols";
    const cost = (done && cache.configs[i + 1])
      ? cache.configs[i + 1].fuel - cache.configs[i].fuel : null;
    parts.push(`<span class="chip ${bad ? "blocked" : done ? "done" : "pending"} ${sym ? "sym" : ""}">${esc(op.name)}</span>`);
    if (cost !== null && cost !== 1) parts.push(`<span class="delta">+${cost}</span>`);
  });
  if (state.pos >= state.program.length) parts.push(`<span class="caret"></span>`);
  el("tape").innerHTML = parts.join("");
  el("tape-reason").textContent =
    cache.blocked ? `${state.program[cache.blocked.index].name}: ${cache.blocked.reason}` : "";
  const caret = el("tape").querySelector(".caret");
  if (caret) caret.scrollIntoView({ block:"nearest", inline:"nearest" });
}

function renderReadouts() {
  const c = current();
  el("r-fuel").textContent = c.fuel;
  el("r-legal").textContent = state.view === "editor"
    ? `${legalHere(c).length}/${OPS.length}` : `—`;
  el("r-step").textContent = state.view === "editor"
    ? `${state.pos}/${state.program.length}` : "—";
}

function renderPbe() {
  const strip = el("pbe");
  if (state.view !== "editor" || state.inputs.length < 2) { strip.hidden = true; return; }
  strip.hidden = false;
  const upto = state.program.slice(0, state.pos);
  el("pbe-rows").innerHTML = state.inputs.map((source, n) => {
    const out = runProgram(upto, parseStack(source));
    const last = out.configs[out.configs.length - 1];
    const bad = !!out.blocked;
    const text = bad ? out.blocked.reason : fmtStack(last.stack);
    return `<span class="row ${bad ? "bad" : ""} ${n === 0 ? "here" : ""}">
      <span class="in">${esc(fmtStack(parseStack(source)))}</span>
      <span class="arrow">&rarr;</span><span class="out">${esc(text)}</span></span>`;
  }).join("");
}

function renderBrowser() {
  const shown = matches(EXAMPLES.map((e, i) => ({ ...e, i, name: e.title + " " + e.group })), state.filter);
  if (state.pick >= shown.length) state.pick = Math.max(0, shown.length - 1);
  let lastGroup = null;
  const cards = shown.map((e, n) => {
    let head = "";
    if (e.group !== lastGroup) { head = `<div class="groupname">${esc(e.group)}</div>`; lastGroup = e.group; }
    const prog = e.kind === "essay" ? "read this first"
      : (e.program ? esc(e.program) : "(empty program)");
    const inputs = e.inputs.length > 1
      ? `<div class="p" style="color:var(--ink-ghost)">${e.inputs.length} inputs, one program</div>` : "";
    return head + `<div class="card ${e.kind === "essay" ? "essay" : ""} ${n === state.pick ? "sel" : ""}" data-idx="${e.i}">
      <div class="t">${esc(e.title)}</div>
      <div class="p ${e.program || e.kind === "essay" ? "" : "blank"}">${prog}</div>
      ${inputs}<div class="n">${esc(e.note)}</div></div>`;
  }).join("");
  el("main").innerHTML = `
    <div class="browser">
      <p class="intro">A concatenative stack machine with <b>52 ops</b>. Every op carries a
      <b>guard</b>: it either applies or says why it cannot, so at any moment only some are
      legal. Programs are ordinary list values here, so the machine can build and run its own
      code &mdash; which is also why a program can now fail to terminate, and why the guard is
      what stops it. Everything is driven from the keyboard.</p>
      ${shown.length ? `<div class="cards">${cards}</div>`
        : `<div class="none">No example matches &ldquo;${esc(state.filter)}&rdquo;. Press Esc to clear.</div>`}
    </div>`;
  el("main").querySelectorAll(".card").forEach(card =>
    card.addEventListener("click", () => open(Number(card.dataset.idx))));
  const sel = el("main").querySelector(".card.sel");
  if (sel) sel.scrollIntoView({ block:"nearest" });
}

const ESSAY = `
<div class="essay-panel"><div class="inner">
<h2>How a program becomes data</h2>
<p>Combinators like <code>map</code> need a <b>quotation</b> &mdash; a program handed to them as
a value. Which raises a question with no obvious answer: how does an op get <i>inside</i> one?
Two designs were available, and the choice shapes everything else here.</p>

<div class="opt no"><h3>A. A bracket mode &mdash; what Forth and Joy actually do</h3>
<p><code>[</code> starts collecting: ops stop executing and pile up as text until <code>]</code>
closes them into a quotation. Familiar, and only two new ops. But between the brackets the stack
does not change and the machine is holding <b>program text rather than values</b>. Intermediate
states stop being states, which is exactly the failure this substrate exists to avoid.</p></div>

<div class="opt yes"><h3>B. An op's name is a value &mdash; what this machine does</h3>
<p><code>'add</code> pushes the <i>name</i> <code>add</code> the same way <code>1</code> pushes the
number one. A quotation is then just a list, built with the <code>nil</code> and <code>cons</code>
you already have, taken apart with <code>uncons</code>, joined with <code>cat</code>, compared with
<code>eq?</code>, and run with <code>i</code>. Every intermediate state is a real value.</p></div>

<p>B is what the examples under <b>Programs as data</b> show. It costs more ops &mdash; one symbol
per op, 26 of them &mdash; and that is not free. Symbols are legal in <i>every</i> state, so they
inflate the branching factor the way the literals already did:</p>

<table><thead><tr><th>basis</th><th>mean legal</th><th>bits / step</th><th>states at depth 5</th></tr></thead>
<tbody>
<tr><td>first-order (18)</td><td>11.14</td><td>3.464</td><td>4,667</td></tr>
<tr><td>+ combinators (26)</td><td>13.32</td><td>3.712</td><td>9,503</td></tr>
<tr><td>+ symbols (52)</td><td>37.28</td><td>5.220</td><td>2,336,843</td></tr>
</tbody></table>

<p>The eight combinators are cheap. The symbols cost another 1.5 bits per step and multiply the
reachable set by five hundred. Gating them is the obvious next change.</p>

<p>There was a tempting middle road: give symbols only to the first eighteen ops, and keep the
branching down. It is wrong, and quietly so. Without <code>'i</code> nothing can name itself, so
<b>every program terminates</b>, so the fuel guard can never fire &mdash; totality would look
earned but still be structural. With full coverage you can write
<code>nil 'i cons 'dup cons dup i</code>, the classic program that never returns, and the machine
simply declines to offer <code>i</code>.</p>

<p class="runit">Press Esc, then open <b>The program that never ends</b> to watch that happen.</p>
</div></div>`;

function renderEssay() {
  el("main").innerHTML = ESSAY;
}

function renderEditor() {
  const c = current();
  const pool = filteredLegal();
  const legalNow = legalHere(c);
  if (state.opIndex >= pool.length) state.opIndex = Math.max(0, pool.length - 1);

  const ghosts = state.ghostNames.map(n => OP_BY_NAME.get(n))
    .filter(op => op && opGuard(op, c) === null)
    .map(op => {
      const [stack, cost] = opApply(op, c);
      return `<div class="ghost ${op === pool[state.opIndex] ? "pick" : ""}">
        <div class="gh"><span class="gn">${esc(op.name)}</span><span class="ge">${esc(op.effect)}${cost !== 1 ? ` &middot; ${cost} fuel` : ""}</span></div>
        ${cellsHtml(stack, c.stack)}</div>`;
    }).join("");

  const rows = [];
  let group = null;
  const listed = state.showRefused ? matches(OPS, state.filter) : pool;
  for (const op of listed) {
    if (op.group !== group) { group = op.group; rows.push(`<div class="label grouphead">${group}</div>`); }
    const reason = opGuard(op, c);
    if (reason === null) {
      const i = pool.indexOf(op);
      rows.push(`<div class="op ${i === state.opIndex ? "sel" : ""}" data-op="${esc(op.name)}">
        <span class="n">${esc(op.name)}</span><span class="e">${esc(op.effect)}</span></div>`);
    } else {
      rows.push(`<div class="op refused"><span class="n">${esc(op.name)}</span><span class="e">${esc(reason)}</span></div>`);
    }
  }
  if (!listed.length) rows.push(`<div class="void">no op here matches &ldquo;${esc(state.filter)}&rdquo;</div>`);

  el("main").innerHTML = `
    <div class="bench">
      <section class="col">
        <div class="head"><span class="label">Stack</span><span class="label" style="color:var(--ink-ghost)">after ${state.pos} of ${state.program.length}</span></div>
        <div class="body">${cellsHtml(c.stack, null)}</div>
      </section>
      <section class="col">
        <div class="head"><span class="label">What if</span><span class="label" style="color:var(--ink-ghost)">${ghosts ? "up to three legal ops, previewed" : "nothing is legal here"}</span></div>
        <div class="body">${ghosts ? `<div class="ghosts">${ghosts}</div>` : `<div class="void">Every op refuses this stack.</div>`}</div>
      </section>
      <section class="col">
        <div class="filterline"><span class="arrow">&rsaquo;</span>
          <span id="entry-mirror" style="flex:1;padding:11px 0;min-width:0;overflow:hidden;white-space:nowrap"></span></div>
        <div class="head"><span class="label">${state.showRefused ? "All 52 ops" : "Legal here"}</span><span class="label" style="color:var(--ink-ghost)">${legalNow.length} of ${OPS.length}</span></div>
        <div class="body"><div class="oplist">${rows.join("")}</div></div>
      </section>
    </div>`;

  const mirror = el("entry-mirror");
  mirror.innerHTML = state.filter
    ? `${esc(state.filter)}<span class="caret" style="display:inline-block;width:2px;height:1em;vertical-align:-2px;margin-left:2px"></span>`
    : `<span style="color:var(--ink-ghost)">type an op&hellip;</span>`;

  el("main").querySelectorAll(".op[data-op]").forEach(row =>
    row.addEventListener("click", () => { insert(OP_BY_NAME.get(row.dataset.op)); }));
  const sel = el("main").querySelector(".op.sel");
  if (sel) sel.scrollIntoView({ block:"nearest" });
}

const KEYS = {
  browser: [["&uarr; &darr;","choose"],["&crarr;","open"],["type","filter"],["Esc","clear"]],
  essay:   [["Esc","back"]],
  editor: [["&larr; &rarr;","step"],["&uarr; &darr;","select op"],["&crarr;","insert &amp; run"],
           ["type","filter"],["&#9003;","delete"],["Tab","reroll previews"],["\\","show refused"],["Esc","back"]],
};

function renderKeys() {
  el("keys").innerHTML = KEYS[state.view].map(([k, d]) => `<span><kbd>${k}</kbd>${d}</span>`).join("");
}

function render() {
  el("subtitle").textContent = state.view === "browser"
    ? "52 ops · every one refuses what it cannot do" : state.note;
  if (state.view === "browser") renderBrowser();
  else if (state.view === "essay") renderEssay();
  else renderEditor();
  renderTape(); renderPbe(); renderReadouts(); renderKeys();
}

/* ---------------------------- actions --------------------------------- */

function setFilter(v) {
  state.filter = v; entry.value = v;
  state.opIndex = 0; state.pick = 0;
  if (state.view === "editor") reroll();
  render();
}

function open(idx) {
  const ex = EXAMPLES[idx];
  state.title = ex.title; state.note = ex.note; state.group = ex.group;
  if (ex.kind === "essay") { state.view = "essay"; setFilter(""); return; }
  state.view = "editor";
  state.inputs = ex.inputs;
  state.start = parseStack(ex.inputs[0]);
  state.program = parse(ex.program);
  recompute();
  state.pos = maxPos();
  state.opIndex = 0;
  setFilter("");
}

function toBrowser() { state.view = "browser"; setFilter(""); }

function insert(op) {
  if (!op || opGuard(op, current()) !== null) return;
  state.program.splice(state.pos, 0, op);
  recompute();
  state.pos = Math.min(state.pos + 1, maxPos());
  state.opIndex = 0;
  setFilter("");
}

function deleteBefore() {
  if (state.pos === 0) return;
  state.program.splice(state.pos - 1, 1);
  state.pos--;
  recompute();
  state.pos = Math.min(state.pos, maxPos());
  reroll(); render();
}

function move(field, delta, len) {
  if (!len) return;
  state[field] = (state[field] + delta + len) % len;
  render();
}

entry.addEventListener("keydown", e => {
  const k = e.key;
  if (state.view === "essay") {
    if (k === "Escape") { toBrowser(); e.preventDefault(); }
    return;
  }
  if (state.view === "browser") {
    const shown = matches(EXAMPLES.map((x, i) => ({ ...x, i, name: x.title + " " + x.group })), state.filter);
    if (k === "ArrowDown")      { move("pick", 1, shown.length); e.preventDefault(); }
    else if (k === "ArrowUp")   { move("pick", -1, shown.length); e.preventDefault(); }
    else if (k === "Enter")     { if (shown[state.pick]) open(shown[state.pick].i); e.preventDefault(); }
    else if (k === "Escape")    { setFilter(""); e.preventDefault(); }
    return;
  }
  if (k === "ArrowLeft")       { state.pos = Math.max(0, state.pos - 1); reroll(); render(); e.preventDefault(); }
  else if (k === "ArrowRight") { state.pos = Math.min(maxPos(), state.pos + 1); reroll(); render(); e.preventDefault(); }
  else if (k === "ArrowDown")  { move("opIndex", 1, filteredLegal().length); e.preventDefault(); }
  else if (k === "ArrowUp")    { move("opIndex", -1, filteredLegal().length); e.preventDefault(); }
  else if (k === "Enter")      { insert(filteredLegal()[state.opIndex]); e.preventDefault(); }
  else if (k === "Tab")        { reroll(); render(); e.preventDefault(); }
  else if (k === "Home")       { state.pos = 0; reroll(); render(); e.preventDefault(); }
  else if (k === "End")        { state.pos = maxPos(); reroll(); render(); e.preventDefault(); }
  else if (k === "\\")         { state.showRefused = !state.showRefused; render(); e.preventDefault(); }
  else if (k === "Backspace" && entry.value === "") { deleteBefore(); e.preventDefault(); }
  else if (k === "Escape")     { entry.value ? setFilter("") : toBrowser(); e.preventDefault(); }
});

entry.addEventListener("input", () => setFilter(entry.value));
entry.addEventListener("blur", () => setTimeout(() => entry.focus(), 0));
document.addEventListener("mousedown", e => {
  if (e.target !== entry) setTimeout(() => entry.focus(), 0);
});

/* ------------------------------ boot ---------------------------------- */

const { checks, fails } = checkConformance();
const badge = el("r-conf");
if (fails.length) {
  badge.className = "badge bad";
  badge.textContent = `✗ ${fails.length}+ disagree with core: ${fails[0]}`;
} else {
  badge.className = "badge ok";
  badge.textContent = `✓ ${checks.toLocaleString()} checks vs Python core`;
}

render();
entry.focus();

</script>
