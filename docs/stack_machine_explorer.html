<title>The Guarded Stack</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=Instrument+Serif&display=swap">

<style>
:root {
  --ground:#E5E6E2; --panel:#F1F2EE; --well:#D9DBD5; --raise:#FAFBF8;
  --ink:#1B1E20; --ink-dim:#5C6469; --ink-ghost:#A5ACAD; --rule:#C6C9C3;
  --gold:#8A6410; --gold-soft:#C9A44E; --blue:#2F5C87;
  --refuse:#9A3B2E; --allow:#4A7238;
  --shadow:0 1px 0 rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground:#141719; --panel:#1C2023; --well:#0F1214; --raise:#232829;
    --ink:#E6E4DE; --ink-dim:#8A9096; --ink-ghost:#4E5659; --rule:#2A2F33;
    --gold:#D8A54A; --gold-soft:#8C7233; --blue:#6E9BC9;
    --refuse:#C2685C; --allow:#7FA86B;
    --shadow:0 1px 0 rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  --ground:#141719; --panel:#1C2023; --well:#0F1214; --raise:#232829;
  --ink:#E6E4DE; --ink-dim:#8A9096; --ink-ghost:#4E5659; --rule:#2A2F33;
  --gold:#D8A54A; --gold-soft:#8C7233; --blue:#6E9BC9;
  --refuse:#C2685C; --allow:#7FA86B;
  --shadow:0 1px 0 rgba(0,0,0,.4);
}

* { box-sizing:border-box; }
body {
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
.label {
  font-family:"IBM Plex Sans Condensed","Helvetica Neue",sans-serif;
  font-weight:600; font-size:10px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-dim);
}
.serif { font-family:"Instrument Serif",Georgia,serif; font-weight:400; }

/* ---------- shell ---------- */
.machine {
  height:100dvh; min-height:520px; display:grid;
  grid-template-rows:auto auto minmax(0,1fr) auto;
  gap:0;
}
.plate {
  display:flex; align-items:baseline; gap:18px; flex-wrap:wrap;
  padding:14px 20px 12px; border-bottom:1px solid var(--rule); background:var(--panel);
}
.plate .name { font-family:"Instrument Serif",Georgia,serif; font-size:27px; line-height:1; letter-spacing:.01em; }
.plate .sub { color:var(--ink-dim); font-size:12px; }
.readouts { margin-left:auto; display:flex; gap:22px; align-items:center; }
.readout { display:flex; flex-direction:column; align-items:flex-end; gap:1px; }
.readout .v { font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:.02em; }
.readout.fuel .v { color:var(--blue); }
.readout.legal .v { color:var(--gold); }
.badge { font-size:11px; letter-spacing:.02em; padding:3px 8px; border:1px solid var(--rule); border-radius:2px; color:var(--ink-dim); white-space:nowrap; }
.badge.ok { color:var(--allow); border-color:color-mix(in srgb,var(--allow) 45%,transparent); }
.badge.bad { color:var(--refuse); border-color:color-mix(in srgb,var(--refuse) 55%,transparent); }

.keys {
  padding:9px 20px; border-top:1px solid var(--rule); background:var(--panel);
  display:flex; gap:16px; flex-wrap:wrap; align-items:center;
  font-size:11px; color:var(--ink-dim);
}
.keys kbd {
  font-family:inherit; font-size:11px; padding:1px 5px; margin-right:5px;
  border:1px solid var(--rule); border-bottom-width:2px; border-radius:3px;
  background:var(--raise); color:var(--ink);
}

/* ---------- tape ---------- */
.tape-row { padding:10px 20px; border-bottom:1px solid var(--rule); display:flex; align-items:center; gap:14px; background:var(--well); }
.tape-row .label { flex:none; }
.tape { flex:1; min-width:0; overflow-x:auto; display:flex; align-items:center; gap:2px; padding:2px 0 6px; scrollbar-width:thin; }
.chip { flex:none; padding:3px 9px; border-radius:2px; border:1px solid transparent; white-space:nowrap; font-size:13px; }
.chip.done { color:var(--ink); background:var(--raise); border-color:var(--rule); }
.chip.pending { color:var(--ink-ghost); }
.chip.blocked { color:var(--refuse); border-color:color-mix(in srgb,var(--refuse) 55%,transparent); background:color-mix(in srgb,var(--refuse) 10%,transparent); }
.caret { flex:none; width:2px; align-self:stretch; background:var(--gold); border-radius:1px; margin:0 1px; animation:blink 1.1s steps(2,start) infinite; }
@keyframes blink { 50% { opacity:.25; } }
.tape .empty { color:var(--ink-ghost); font-size:12px; }
.reason { flex:none; color:var(--refuse); font-size:12px; }

/* ---------- bench ---------- */
.bench { display:grid; grid-template-columns:minmax(190px,1fr) minmax(0,1.55fr) minmax(230px,.95fr); min-height:0; }
.col { min-height:0; display:flex; flex-direction:column; border-right:1px solid var(--rule); }
.col:last-child { border-right:none; }
.col > .head { padding:9px 16px 7px; border-bottom:1px solid var(--rule); display:flex; align-items:baseline; gap:8px; }
.col > .body { flex:1; min-height:0; overflow-y:auto; padding:12px 16px 16px; scrollbar-width:thin; }

/* stack cells */
.cells { display:flex; flex-direction:column-reverse; gap:5px; align-items:stretch; }
.cell {
  display:flex; align-items:baseline; gap:9px; padding:6px 9px; border-radius:2px;
  background:var(--raise); border:1px solid var(--rule); border-left:3px solid var(--rule);
}
.cell .d { flex:none; font-size:10px; letter-spacing:.1em; color:var(--ink-dim); text-transform:uppercase; min-width:26px; }
.cell .v { overflow-wrap:anywhere; }
.cell.top { border-left-color:var(--gold); }
.cell.top .d { color:var(--gold); }
.cell.long .v { font-size:11.5px; line-height:1.35; }
.void { color:var(--ink-ghost); font-size:12px; padding:6px 2px; }

/* ghosts */
.ghosts { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px; align-items:start; }
.ghost { min-width:0; }
.ghost .gh { display:flex; align-items:baseline; gap:7px; padding-bottom:7px; margin-bottom:8px; border-bottom:1px solid var(--rule); }
.ghost .gn { font-weight:600; color:var(--ink-dim); }
.ghost.pick .gn { color:var(--gold); }
.ghost .ge { font-size:10.5px; color:var(--ink-ghost); }
.ghost .cell { background:transparent; border-color:color-mix(in srgb,var(--rule) 60%,transparent); border-left-color:color-mix(in srgb,var(--rule) 60%,transparent); color:var(--ink-ghost); }
.ghost .cell .d { color:var(--ink-ghost); }
.ghost .cell.new { border-left-color:var(--gold-soft); color:var(--ink-dim); }
.ghost .cell.new .d { color:var(--gold-soft); }

/* palette */
.filterline { display:flex; align-items:center; gap:8px; padding:0 16px; border-bottom:1px solid var(--rule); background:var(--well); }
.filterline .arrow { color:var(--gold); }
#entry {
  flex:1; min-width:0; border:0; outline:0; background:transparent; color:var(--ink);
  font:inherit; padding:11px 0; caret-color:var(--gold);
}
#entry::placeholder { color:var(--ink-ghost); }
.oplist { display:flex; flex-direction:column; gap:1px; }
.op { display:flex; align-items:baseline; gap:10px; padding:5px 9px; border-left:3px solid transparent; border-radius:2px; cursor:pointer; }
.op .n { font-weight:500; min-width:56px; }
.op .e { font-size:11px; color:var(--ink-ghost); overflow-wrap:anywhere; }
.op.sel { background:var(--raise); border-left-color:var(--gold); }
.op.sel .n { color:var(--gold); }
.op.refused { cursor:default; }
.op.refused .n { color:var(--ink-ghost); text-decoration:line-through; text-decoration-color:color-mix(in srgb,var(--refuse) 60%,transparent); }
.op.refused .e { color:var(--refuse); opacity:.75; }
.grouphead { padding:11px 0 4px; }
.grouphead:first-child { padding-top:0; }

/* ---------- browser ---------- */
.browser { min-height:0; overflow-y:auto; padding:18px 20px 24px; scrollbar-width:thin; }
.browser .intro { max-width:64ch; color:var(--ink-dim); font-size:12.5px; margin:0 0 18px; line-height:1.6; }
.browser .intro b { color:var(--ink); font-weight:500; }
.cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:1px; background:var(--rule); border:1px solid var(--rule); }
.card { background:var(--panel); padding:12px 15px 14px; cursor:pointer; border-left:3px solid transparent; display:flex; flex-direction:column; gap:5px; }
.card .t { font-family:"Instrument Serif",Georgia,serif; font-size:20px; line-height:1.2; text-wrap:balance; }
.card .p { font-size:12px; color:var(--gold); overflow-wrap:anywhere; }
.card .p.blank { color:var(--ink-ghost); }
.card .n { font-family:"IBM Plex Sans Condensed","Helvetica Neue",sans-serif; font-size:12.5px; color:var(--ink-dim); line-height:1.45; }
.card.sel { background:var(--raise); border-left-color:var(--gold); }
.browser .none { color:var(--ink-ghost); font-size:12.5px; }

@media (max-width:880px) {
  .machine { height:auto; min-height:100dvh; }
  .bench { grid-template-columns:1fr; }
  .col { border-right:none; border-bottom:1px solid var(--rule); }
  .col > .body { overflow-y:visible; }
  .readouts { width:100%; margin-left:0; justify-content:flex-start; }
}
@media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none !important; transition:none !important; } }
:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
</style>

const Int  = v => ({ t:"int",  v });          // v is a BigInt
const Bool = v => ({ t:"bool", v });
const Lst  = items => ({ t:"list", items });
const NIL = Lst([]), TRUE = Bool(true), FALSE = Bool(false), ZERO = Int(0n), ONE = Int(1n);

  if (v.t === "int")  return ["int", v.v.toString()];

  if (v.t === "int")  return v.v.toString();

  name, group:"arithmetic", effect:"( a b -- c )",
  guard: c => {
    const r = needs(c, 2); if (r !== null) return r;
    const a = peek(c, 1), b = peek(c, 0);
    if (a.t !== "int" || b.t !== "int") return "top two values are not both integers";
    return extra ? extra(a.v, b.v) : null;
  },
  apply: c => [[...c.stack.slice(0, -2), Int(combine(peek(c,1).v, peek(c,0).v))], 1],
});

const plumbing = (name, effect, n, rearrange) => ({
  name, group:"plumbing", effect,
  guard: c => needs(c, n),
  apply: c => [rearrange(c), 1],
});

const OPS = [
  literal("0", ZERO), literal("1", ONE), literal("nil", NIL),
  literal("true", TRUE), literal("false", FALSE),

  plumbing("dup",  "( a -- a a )",     1, c => [...c.stack, peek(c,0)]),
  plumbing("swap", "( a b -- b a )",   2, c => [...c.stack.slice(0,-2), peek(c,0), peek(c,1)]),
  plumbing("drop", "( a -- )",         1, c => c.stack.slice(0,-1)),
  plumbing("over", "( a b -- a b a )", 2, c => [...c.stack, peek(c,1)]),

  { name:"cons", group:"structure", effect:"( lst a -- lst' )",
    guard: c => {
      const r = needs(c, 2); if (r !== null) return r;
      return peek(c,1).t !== "list" ? "second value is not a list" : null;
    },
    apply: c => [[...c.stack.slice(0,-2), Lst([peek(c,0), ...peek(c,1).items])], 1] },

  { name:"uncons", group:"structure", effect:"( lst -- tail head )",
    guard: c => {
      const r = needs(c, 1); if (r !== null) return r;
      const t = peek(c,0);
      if (t.t !== "list") return "top is not a list";
      return t.items.length === 0 ? "list is empty" : null;
    },
    apply: c => {
      const t = peek(c,0);
      return [[...c.stack.slice(0,-1), Lst(t.items.slice(1)), t.items[0]], 1];
    } },

  { name:"null?", group:"structure", effect:"( lst -- bool )",
    guard: c => {
      const r = needs(c, 1); if (r !== null) return r;
      return peek(c,0).t !== "list" ? "top is not a list" : null;
    },
    apply: c => [[...c.stack.slice(0,-1), Bool(peek(c,0).items.length === 0)], 1] },

  intBinary("add", (a,b) => a + b),
  intBinary("sub", (a,b) => a - b),
  intBinary("mul", (a,b) => a * b),
  intBinary("div", floorDiv, (a,b) => b === 0n ? "division by zero" : null),

  { name:"eq?", group:"predicates", effect:"( a b -- bool )",
    guard: c => needs(c, 2),
    apply: c => [[...c.stack.slice(0,-2), Bool(same(peek(c,1), peek(c,0)))], 1] },

  { name:"lt?", group:"predicates", effect:"( a b -- bool )",
    guard: c => {
      const r = needs(c, 2); if (r !== null) return r;
      const a = peek(c,1), b = peek(c,0);
      return (a.t !== "int" || b.t !== "int") ? "top two values are not both integers" : null;
    },
    apply: c => [[...c.stack.slice(0,-2), Bool(peek(c,1).v < peek(c,0).v)], 1] },
];

const OP_BY_NAME = new Map(OPS.map(op => [op.name, op]));
const GROUPS = ["literals","plumbing","structure","arithmetic","predicates"];
const legalOps  = c => OPS.filter(op => op.guard(c) === null);
const legalMask = c => OPS.map(op => op.guard(c) === null);

function runProgram(program) {
  let c = { stack:[], fuel:0 };
  const configs = [c];
  let blocked = null;
  for (let i = 0; i < program.length; i++) {
    const reason = program[i].guard(c);
    if (reason !== null) { blocked = { index:i, reason }; break; }
    const [stack, cost] = program[i].apply(c);
    c = { stack, fuel: c.fuel + cost };
    configs.push(c);
  }
  return { configs, blocked };
}

const parse = text => text.split(/\s+/).filter(Boolean).map(n => OP_BY_NAME.get(n));

/* ---------------------- conformance against the core ------------------ */

const FIXTURE = JSON.parse(document.getElementById("conformance").textContent);

function checkConformance() {
  let checks = 0;
  const fails = [];
  const note = m => { if (fails.length < 4) fails.push(m); };

  FIXTURE.ops.forEach((spec, i) => {
    checks++;
    if (!OPS[i] || OPS[i].name !== spec.name || OPS[i].group !== spec.group ||
        OPS[i].effect !== spec.effect) note(`op ${i} (${spec.name})`);
  });
  checks++;
  if (OPS.length !== FIXTURE.ops.length) note("op count");

  for (const ex of [...FIXTURE.examples, ...FIXTURE.probes.map(p => ({ ...p, title:`probe ${p.program}` }))]) {
    const { configs } = runProgram(parse(ex.program));
    ex.trace.forEach((row, i) => {
      checks += 3;
      const c = configs[i];
      if (!c) { note(`${ex.title} step ${i} missing`); return; }
      if (fmtStack(c.stack) !== row.stack) note(`${ex.title} step ${i} stack`);
      if (c.fuel !== row.fuel) note(`${ex.title} step ${i} fuel`);
      if (legalOps(c).map(o => o.name).join(" ") !== row.legal.join(" "))
        note(`${ex.title} step ${i} legal`);
    });
  }

  for (const w of FIXTURE.walks) {
    const { configs, blocked } = runProgram(parse(w.program));
    const c = configs[configs.length - 1];
    checks += 3;
    if (blocked) note(`walk blocked: ${w.program}`);
    if (fmtStack(c.stack) !== w.stack) note(`walk stack: ${w.program}`);
    if (c.fuel !== w.fuel) note(`walk fuel: ${w.program}`);
    if (legalMask(c).map(b => b ? "1" : "0").join("") !== w.mask)
      note(`walk mask: ${w.program}`);
  }
  return { checks, fails };
}

/* ==== PORTABLE MACHINE END ==== */

/* ======================================================================
   The explorer
   ====================================================================== */

const el = id => document.getElementById(id);
const entry = el("entry");

const EXAMPLES = FIXTURE.examples.map(e => ({ title:e.title, program:e.program, note:e.note }));

const state = {
  view: "browser",
  filter: "",
  pick: 0,          // selection in the browser
  program: [],      // Op objects
  pos: 0,           // ops executed so far
  title: "",
  note: "",
  opIndex: 0,       // selection in the palette
  ghostNames: [],
  showRefused: false,
};

let cache = { configs:[{stack:[],fuel:0}], blocked:null };

const recompute = () => { cache = runProgram(state.program); };
const maxPos = () => cache.configs.length - 1;
const current = () => cache.configs[Math.min(state.pos, maxPos())];

function matches(list, filter) {
  if (!filter) return list;
  const f = filter.toLowerCase();
  const starts = list.filter(x => x.name.toLowerCase().startsWith(f));
  return starts.length ? starts : list.filter(x => x.name.toLowerCase().includes(f));
}
const filteredLegal = () => matches(legalOps(current()), state.filter);

function reroll() {
  const pool = filteredLegal();
  const selected = pool[state.opIndex];
  const rest = pool.filter(op => op !== selected);
  for (let i = rest.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [rest[i], rest[j]] = [rest[j], rest[i]];
  }
  const chosen = selected ? [selected, ...rest.slice(0, 2)] : rest.slice(0, 3);
  state.ghostNames = chosen.map(op => op.name);
}

/* ---------------------------- rendering ------------------------------- */

const esc = s => s.replace(/[&<>]/g, ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[ch]));

function cellsHtml(stack, ghostFrom) {
  if (!stack.length) return `<div class="void">empty stack</div>`;
  const keys = stack.map(keyOf);
  let shared = 0;
  if (ghostFrom) {
    const base = ghostFrom.map(keyOf);
    while (shared < keys.length && shared < base.length && keys[shared] === base[shared]) shared++;
  }
  return `<div class="cells">` + stack.map((v, i) => {
    const text = fmt(v);
    const depth = stack.length - 1 - i;
    const cls = ["cell"];
    if (depth === 0) cls.push("top");
    if (text.length > 22) cls.push("long");
    if (ghostFrom && i >= shared) cls.push("new");
    const tag = depth === 0 ? "top" : String(depth);
    return `<div class="${cls.join(" ")}"><span class="d">${tag}</span><span class="v">${esc(text)}</span></div>`;
  }).join("") + `</div>`;
}

function renderTape() {
  const row = el("tape-row");
  if (state.view !== "editor") { row.hidden = true; return; }
  row.hidden = false;
  const parts = [];
  if (!state.program.length) parts.push(`<span class="empty">nothing yet &mdash; type an op below and press Enter</span>`);
  state.program.forEach((op, i) => {
    if (i === state.pos) parts.push(`<span class="caret"></span>`);
    const done = i < state.pos;
    const bad = cache.blocked && cache.blocked.index === i;
    parts.push(`<span class="chip ${bad ? "blocked" : done ? "done" : "pending"}">${esc(op.name)}</span>`);
  });
  if (state.pos >= state.program.length) parts.push(`<span class="caret"></span>`);
  el("tape").innerHTML = parts.join("");
  el("tape-reason").textContent =
    cache.blocked ? `${state.program[cache.blocked.index].name}: ${cache.blocked.reason}` : "";
  const caret = el("tape").querySelector(".caret");
  if (caret) caret.scrollIntoView({ block:"nearest", inline:"nearest" });
}

function renderReadouts() {
  const c = current();
  el("r-fuel").textContent = c.fuel;
  el("r-legal").textContent = `${legalOps(c).length}/${OPS.length}`;
  el("r-step").textContent = state.view === "editor" ? `${state.pos}/${state.program.length}` : "—";
}

function renderBrowser() {
  const shown = matches(EXAMPLES.map((e, i) => ({ ...e, i, name:e.title })), state.filter);
  if (state.pick >= shown.length) state.pick = Math.max(0, shown.length - 1);
  const cards = shown.map((e, n) => `
    <div class="card ${n === state.pick ? "sel" : ""}" data-idx="${e.i}">
      <div class="t">${esc(e.title)}</div>
      <div class="p ${e.program ? "" : "blank"}">${e.program ? esc(e.program) : "(empty program)"}</div>
      <div class="n">${esc(e.note)}</div>
    </div>`).join("");
  el("main").innerHTML = `
    <div class="browser">
      <p class="intro">A concatenative stack machine with <b>18 ops</b>. Every op carries a
      <b>guard</b>: it either applies or tells you why it cannot, so at any moment only some
      of the 18 are legal. Pick a program to take apart, or start from an empty stack.
      Everything here is driven from the keyboard.</p>
      ${shown.length ? `<div class="cards">${cards}</div>` : `<div class="none">No example matches &ldquo;${esc(state.filter)}&rdquo;. Press Esc to clear.</div>`}
    </div>`;
  el("main").querySelectorAll(".card").forEach(card =>
    card.addEventListener("click", () => open(Number(card.dataset.idx))));
  const sel = el("main").querySelector(".card.sel");
  if (sel) sel.scrollIntoView({ block:"nearest" });
}

function renderEditor() {
  const c = current();
  const pool = filteredLegal();
  const legalNow = legalOps(c);
  if (state.opIndex >= pool.length) state.opIndex = Math.max(0, pool.length - 1);

  const ghosts = state.ghostNames.map(n => OP_BY_NAME.get(n))
    .filter(op => op && op.guard(c) === null)
    .map(op => {
      const [stack] = op.apply(c);
      return `<div class="ghost ${op === pool[state.opIndex] ? "pick" : ""}">
        <div class="gh"><span class="gn">${esc(op.name)}</span><span class="ge">${esc(op.effect)}</span></div>
        ${cellsHtml(stack, c.stack)}
      </div>`;
    }).join("");

  const rows = [];
  let group = null;
  const listed = state.showRefused ? matches(OPS, state.filter) : pool;
  for (const op of listed) {
    if (op.group !== group) { group = op.group; rows.push(`<div class="label grouphead">${group}</div>`); }
    const reason = op.guard(c);
    if (reason === null) {
      const i = pool.indexOf(op);
      rows.push(`<div class="op ${i === state.opIndex ? "sel" : ""}" data-op="${esc(op.name)}">
        <span class="n">${esc(op.name)}</span><span class="e">${esc(op.effect)}</span></div>`);
    } else {
      rows.push(`<div class="op refused"><span class="n">${esc(op.name)}</span><span class="e">${esc(reason)}</span></div>`);
    }
  }
  if (!listed.length) rows.push(`<div class="void">no op here matches &ldquo;${esc(state.filter)}&rdquo;</div>`);

  el("main").innerHTML = `
    <div class="bench">
      <section class="col">
        <div class="head"><span class="label">Stack</span><span class="ge label" style="color:var(--ink-ghost)">after ${state.pos} of ${state.program.length}</span></div>
        <div class="body">${cellsHtml(c.stack, null)}</div>
      </section>
      <section class="col">
        <div class="head"><span class="label">What if</span><span class="label" style="color:var(--ink-ghost)">${ghosts ? "up to three legal ops, previewed" : "nothing is legal here"}</span></div>
        <div class="body">${ghosts ? `<div class="ghosts">${ghosts}</div>` : `<div class="void">Every op refuses this stack.</div>`}</div>
      </section>
      <section class="col">
        <div class="filterline"><span class="arrow">&rsaquo;</span>
          <span id="entry-mirror" style="flex:1;padding:11px 0;min-width:0;overflow:hidden;white-space:nowrap"></span></div>
        <div class="head"><span class="label">${state.showRefused ? "All 18 ops" : "Legal here"}</span><span class="label" style="color:var(--ink-ghost)">${legalNow.length} of ${OPS.length}</span></div>
        <div class="body"><div class="oplist">${rows.join("")}</div></div>
      </section>
    </div>`;

  const mirror = el("entry-mirror");
  mirror.innerHTML = state.filter
    ? `${esc(state.filter)}<span class="caret" style="display:inline-block;width:2px;height:1em;vertical-align:-2px;margin-left:2px"></span>`
    : `<span style="color:var(--ink-ghost)">type an op&hellip;</span>`;

  el("main").querySelectorAll(".op[data-op]").forEach(row =>
    row.addEventListener("click", () => { insert(OP_BY_NAME.get(row.dataset.op)); }));
  const sel = el("main").querySelector(".op.sel");
  if (sel) sel.scrollIntoView({ block:"nearest" });
}

const KEYS = {
  browser: [["&uarr; &darr;","choose"],["&crarr;","open"],["type","filter"],["Esc","clear"]],
  editor: [["&larr; &rarr;","step"],["&uarr; &darr;","select op"],["&crarr;","insert &amp; run"],
           ["type","filter"],["&#9003;","delete"],["Tab","reroll previews"],["\\","show refused"],["Esc","back"]],
};

function renderKeys() {
  el("keys").innerHTML = KEYS[state.view]
    .map(([k, d]) => `<span><kbd>${k}</kbd>${d}</span>`).join("");
}

function render() {
  el("subtitle").textContent = state.view === "editor"
    ? state.note : "18 ops · every one refuses what it cannot do";
  if (state.view === "browser") renderBrowser(); else renderEditor();
  renderTape(); renderReadouts(); renderKeys();
}

/* ---------------------------- actions --------------------------------- */

function setFilter(v) {
  state.filter = v; entry.value = v;
  state.opIndex = 0; state.pick = 0;
  if (state.view === "editor") reroll();
  render();
}

function open(idx) {
  const ex = EXAMPLES[idx];
  state.view = "editor";
  state.program = parse(ex.program);
  state.title = ex.title;
  state.note = ex.note;
  recompute();
  state.pos = maxPos();
  state.opIndex = 0;
  setFilter("");
}

function toBrowser() { state.view = "browser"; setFilter(""); }

function insert(op) {
  if (!op || op.guard(current()) !== null) return;
  state.program.splice(state.pos, 0, op);
  recompute();
  state.pos = Math.min(state.pos + 1, maxPos());
  state.opIndex = 0;
  setFilter("");
}

function deleteBefore() {
  if (state.pos === 0) return;
  state.program.splice(state.pos - 1, 1);
  state.pos--;
  recompute();
  state.pos = Math.min(state.pos, maxPos());
  reroll(); render();
}

function move(field, delta, len) {
  if (!len) return;
  state[field] = (state[field] + delta + len) % len;
  render();
}

entry.addEventListener("keydown", e => {
  const k = e.key;
  if (state.view === "browser") {
    const len = matches(EXAMPLES.map(x => ({ ...x, name:x.title })), state.filter).length;
    if (k === "ArrowDown")      { move("pick", 1, len); e.preventDefault(); }
    else if (k === "ArrowUp")   { move("pick", -1, len); e.preventDefault(); }
    else if (k === "Enter")     {
      const shown = matches(EXAMPLES.map((x, i) => ({ ...x, i, name:x.title })), state.filter);
      if (shown[state.pick]) open(shown[state.pick].i);
      e.preventDefault();
    }
    else if (k === "Escape")    { setFilter(""); e.preventDefault(); }
    return;
  }
  if (k === "ArrowLeft")       { state.pos = Math.max(0, state.pos - 1); reroll(); render(); e.preventDefault(); }
  else if (k === "ArrowRight") { state.pos = Math.min(maxPos(), state.pos + 1); reroll(); render(); e.preventDefault(); }
  else if (k === "ArrowDown")  { move("opIndex", 1, filteredLegal().length); e.preventDefault(); }
  else if (k === "ArrowUp")    { move("opIndex", -1, filteredLegal().length); e.preventDefault(); }
  else if (k === "Enter")      { insert(filteredLegal()[state.opIndex]); e.preventDefault(); }
  else if (k === "Tab")        { reroll(); render(); e.preventDefault(); }
  else if (k === "Home")       { state.pos = 0; reroll(); render(); e.preventDefault(); }
  else if (k === "End")        { state.pos = maxPos(); reroll(); render(); e.preventDefault(); }
  else if (k === "\\")         { state.showRefused = !state.showRefused; render(); e.preventDefault(); }
  else if (k === "Backspace" && entry.value === "") { deleteBefore(); e.preventDefault(); }
  else if (k === "Escape")     { entry.value ? setFilter("") : toBrowser(); e.preventDefault(); }
});

entry.addEventListener("input", () => setFilter(entry.value));
entry.addEventListener("blur", () => setTimeout(() => entry.focus(), 0));
document.addEventListener("mousedown", e => {
  if (e.target !== entry) setTimeout(() => entry.focus(), 0);
});

/* ------------------------------ boot ---------------------------------- */

const { checks, fails } = checkConformance();
const badge = el("r-conf");
if (fails.length) {
  badge.className = "badge bad";
  badge.textContent = `✗ ${fails.length}+ disagree with core: ${fails[0]}`;
} else {
  badge.className = "badge ok";
  badge.textContent = `✓ ${checks.toLocaleString()} checks vs Python core`;
}

render();
entry.focus();
</script>
