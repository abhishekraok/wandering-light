<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Watch the stack solver think</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=Instrument+Serif&display=swap">
<style>
:root {
  --ground:#E5E6E2; --panel:#F1F2EE; --well:#D9DBD5; --raise:#FAFBF8;
  --ink:#1B1E20; --ink-dim:#5C6469; --ink-ghost:#A5ACAD; --rule:#C6C9C3;
  --gold:#8A6410; --gold-soft:#C9A44E; --blue:#2F5C87;
  --refuse:#9A3B2E; --allow:#4A7238; --mark:#7A4F9C;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground:#141719; --panel:#1C2023; --well:#0F1214; --raise:#232829;
    --ink:#E6E4DE; --ink-dim:#8A9096; --ink-ghost:#4E5659; --rule:#2A2F33;
    --gold:#D8A54A; --gold-soft:#8C7233; --blue:#6E9BC9;
    --refuse:#C2685C; --allow:#7FA86B; --mark:#B48AD6;
  }
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
body {
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:13px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
.label {
  font-family:"IBM Plex Sans Condensed","Helvetica Neue",sans-serif;
  font-weight:600; font-size:10px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-dim);
}
.machine { height:100dvh; min-height:600px; display:grid; grid-template-rows:auto auto auto auto minmax(0,1fr) auto; }

.plate { display:flex; align-items:baseline; gap:16px; flex-wrap:wrap;
  padding:10px 18px 8px; border-bottom:1px solid var(--rule); background:var(--panel); }
.plate .name { font-family:"Instrument Serif",Georgia,serif; font-size:24px; line-height:1; }
.plate .sub { color:var(--ink-dim); font-size:11.5px; }
.readouts { margin-left:auto; display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
.readout { display:flex; flex-direction:column; align-items:flex-end; gap:1px; }
.readout .v { font-size:14px; font-weight:600; font-variant-numeric:tabular-nums; }
.readout.exec .v { color:var(--blue); }
.readout.depth .v { color:var(--gold); }
.badge { font-size:11px; padding:3px 8px; border:1px solid var(--rule); border-radius:2px;
  color:var(--ink-dim); white-space:nowrap; }
.badge.ok { color:var(--allow); border-color:color-mix(in srgb,var(--allow) 45%,transparent); }
.badge.bad { color:var(--refuse); border-color:color-mix(in srgb,var(--refuse) 55%,transparent); }
.badge.warn { color:var(--gold); border-color:color-mix(in srgb,var(--gold) 55%,transparent); }

/* task strip */
.strip { display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:6px 18px;
  padding:8px 18px; border-bottom:1px solid var(--rule); background:var(--well); font-size:12px; }
.strip .cellrow { min-width:0; display:flex; align-items:baseline; gap:9px; }
.strip .v { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.strip .examples { grid-column:1; display:flex; flex-direction:column; gap:2px; }
.strip .ex { display:flex; align-items:center; gap:6px; white-space:nowrap; overflow:hidden; }
.strip .ex .arrow { color:var(--ink-ghost); }
.strip .right { grid-column:2; grid-row:1 / span 2; display:flex; flex-direction:column; gap:4px; min-width:0; }

/* alive strip */
.alive { display:flex; align-items:center; gap:10px; padding:5px 18px; border-bottom:1px solid var(--rule); background:var(--panel); font-size:11px; color:var(--ink-dim); }
.alive .cells { display:flex; gap:2px; flex:1; min-width:0; }
.alive .cell { flex:1; height:12px; border-radius:1px; background:var(--well); cursor:pointer; position:relative; min-width:4px; }
.alive .cell.on { background:color-mix(in srgb,var(--allow) 55%,var(--well)); }
.alive .cell.off { background:color-mix(in srgb,var(--refuse) 40%,var(--well)); }
.alive .cell.fit { background:color-mix(in srgb,var(--gold) 80%,var(--well)); }
.alive .cell.cur { outline:2px solid var(--gold); outline-offset:1px; }
.alive .cell.unreached { opacity:.35; }

.story {
  padding:6px 18px; border-bottom:1px solid var(--rule); background:var(--panel);
  font-size:12px; color:var(--ink-dim);
  display:flex; gap:20px; align-items:baseline; justify-content:space-between;
}
.story .line { min-width:0; }
.story b { color:var(--ink); font-weight:600; }
.story .hint { flex:none; color:var(--ink-ghost); white-space:nowrap; }
.story .alive-t { color:var(--allow); }
.story .dead-t { color:var(--refuse); }

/* bench */
.bench { display:grid; grid-template-columns:minmax(230px,.9fr) minmax(0,1.35fr) minmax(300px,1.15fr); min-height:0; }
.col { min-height:0; display:flex; flex-direction:column; border-right:1px solid var(--rule); }
.col:last-child { border-right:none; }
.col > .head { padding:7px 14px 5px; border-bottom:1px solid var(--rule); display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
.col > .body { flex:1; min-height:0; overflow-y:auto; padding:8px 12px 14px; scrollbar-width:thin; }

/* beam list */
.node { padding:5px 8px; border:1px solid var(--rule); border-left:3px solid var(--rule);
  border-radius:2px; background:var(--raise); margin-bottom:4px; cursor:pointer; }
.node:hover { border-color:var(--gold-soft); }
.node.sel { border-left-color:var(--gold); background:color-mix(in srgb,var(--gold) 8%,var(--raise)); }
.node.witness { border-left-color:var(--allow); }
.node .top { display:flex; align-items:baseline; gap:8px; }
.node .r { font-size:10px; color:var(--ink-dim); min-width:20px; }
.node .lp { margin-left:auto; font-size:11px; color:var(--blue); font-variant-numeric:tabular-nums; }
.node .prog { font-size:11px; color:var(--ink-dim); overflow-wrap:anywhere; margin:1px 0; }
.node .stk { margin-top:2px; }

/* program tokens */
.prog .tk { display:inline-block; margin:0 3px 1px 0; }
.prog .tk.d1 { color:var(--mark); }
.prog .tk.d2 { color:color-mix(in srgb,var(--mark) 70%,var(--blue)); }
.prog .tk.d3 { color:var(--blue); }
.prog .tk.br { font-weight:600; }
.prog .tk.cur { background:color-mix(in srgb,var(--gold) 28%,transparent); border-radius:2px; padding:0 2px; }
.prog .tk.done { opacity:.55; }

/* stacks as chips */
.stk { display:flex; flex-wrap:wrap; align-items:center; gap:2px 3px; min-width:0; }
.stk.compact { flex-wrap:nowrap; overflow:hidden; }
.chip { display:inline-flex; align-items:center; padding:0 5px; height:18px; line-height:18px; font-size:11.5px;
  border-radius:3px; border:1px solid var(--rule); background:var(--raise); white-space:nowrap; }
.chip.int { color:var(--ink); }
.chip.bool { color:var(--blue); font-style:italic; }
.chip.sym { color:var(--ink-dim); border-style:dashed; }
.chip.mark { color:var(--mark); border-color:var(--mark); font-weight:600; padding:0 4px; }
.chip.new { box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 55%,transparent); }
.chip.ell { color:var(--ink-ghost); border-color:transparent; }
.grp { display:inline-flex; align-items:center; gap:2px; padding:1px 3px; border-radius:4px;
  border:1px solid color-mix(in srgb,var(--blue) 40%,var(--rule)); background:color-mix(in srgb,var(--blue) 6%,transparent); }
.grp > .paren { color:var(--blue); font-size:11px; }
.grp.new { box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 55%,transparent); }
.open { display:inline-flex; align-items:center; gap:2px; padding:1px 3px; border-radius:4px;
  border:1px dashed var(--mark); background:color-mix(in srgb,var(--mark) 7%,transparent); }
.open > .lbl { color:var(--mark); font-size:10px; margin-right:2px; }
.stk .empty { color:var(--ink-ghost); font-size:11px; }
.stk .tick { color:var(--allow); font-weight:600; margin-left:4px; }
.stk .cross { color:var(--ink-ghost); margin-left:4px; }

/* op tape */
.exp { display:grid; grid-template-columns:auto 70px 1fr auto; gap:6px 8px; align-items:center;
  padding:3px 7px; border-radius:2px; border:1px solid transparent; font-size:12px; cursor:pointer; }
.exp:hover { border-color:var(--rule); }
.exp.cur { border-color:var(--gold); background:color-mix(in srgb,var(--gold) 9%,transparent); }
.exp .o { font-size:10px; color:var(--ink-ghost); font-variant-numeric:tabular-nums; min-width:16px; }
.exp .fn { font-weight:500; }
.exp .fn.gt { color:var(--allow); }
.exp .lp { font-size:11px; color:var(--blue); font-variant-numeric:tabular-nums; text-align:right; }
.exp .succ { grid-column:1/5; padding-left:24px; }
.exp .why { grid-column:1/5; padding-left:24px; font-size:11px; color:var(--ink-dim); }
.oc { font-size:10px; letter-spacing:.06em; text-transform:uppercase; white-space:nowrap; }
.oc.retained { color:var(--allow); }
.oc.fit { color:var(--gold); font-weight:600; }
.oc.duplicate { color:var(--ink-ghost); }
.oc.refused { color:var(--refuse); }
.oc.cut { color:var(--ink-ghost); }
.oc.guard { color:var(--refuse); opacity:.8; }
.oc.captured { color:var(--mark); }
.oc.executed { color:var(--ink-dim); }
.oc.legal { color:var(--allow); }
.gt-tag { margin-left:6px; font-size:10px; color:var(--allow); letter-spacing:.04em; }
.keycap { display:inline-block; min-width:15px; text-align:center; font-size:10px; padding:0 3px;
  border:1px solid var(--rule); border-bottom-width:2px; border-radius:3px; background:var(--raise);
  color:var(--gold); margin-right:5px; }

/* inspector */
.kv { display:grid; grid-template-columns:auto 1fr; gap:3px 10px; font-size:12px; margin-bottom:8px; }
.kv .k { color:var(--ink-dim); }
.kv .v { overflow-wrap:anywhere; font-variant-numeric:tabular-nums; }
.exrow { display:grid; grid-template-columns:auto 1fr auto 1fr; gap:6px; align-items:center; padding:4px 0; border-bottom:1px dashed var(--rule); }
.exrow .n { font-size:10px; color:var(--ink-dim); min-width:22px; }
.exrow .arrow { color:var(--ink-ghost); font-size:11px; }
.bar { display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; font-size:12px; padding:2px 0; cursor:pointer; }
.bar .track { position:relative; height:14px; background:var(--well); border-radius:2px; overflow:hidden; }
.bar .fill { position:absolute; inset:0 auto 0 0; background:color-mix(in srgb,var(--blue) 45%,transparent); }
.bar .nm { position:absolute; left:5px; top:0; line-height:14px; font-size:11px; }
.bar .pc { font-size:11px; color:var(--ink-dim); font-variant-numeric:tabular-nums; min-width:52px; text-align:right; }
.bar.refused .fill { background:color-mix(in srgb,var(--refuse) 22%,transparent); }
.bar.picked .fill { background:color-mix(in srgb,var(--gold) 50%,transparent); }
.bar.witness .track { box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--allow) 60%,transparent); }
.bar .tried { margin-left:8px; font-size:10px; color:var(--gold); letter-spacing:.04em; }
.bar .gt { margin-left:8px; font-size:10px; color:var(--allow); letter-spacing:.04em; }
.gtline { font-size:11.5px; color:var(--allow); padding:3px 0 6px; border-bottom:1px solid color-mix(in srgb,var(--allow) 25%,transparent); margin-bottom:6px; }
.gtline b { color:var(--ink); font-weight:600; }
.label.off { padding:3px 0 6px; text-transform:none; letter-spacing:0; font-size:11.5px; }
h4.sec { margin:12px 0 6px; font-family:"IBM Plex Sans Condensed",sans-serif; font-weight:600;
  font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-dim);
  border-top:1px solid var(--rule); padding-top:9px; }
h4.sec:first-child { border-top:none; margin-top:0; padding-top:0; }
.tokens { display:flex; flex-wrap:wrap; gap:2px; font-size:10.5px; }
.tokens .t { padding:0 3px; border:1px solid var(--rule); border-radius:2px; background:var(--raise); }
.tokens .t.sep { color:var(--gold); border-color:var(--gold); }
.tokens .t.tgt { background:color-mix(in srgb,var(--blue) 8%,var(--raise)); }
.note { font-size:11.5px; color:var(--ink-dim); margin:4px 0; }
.note b { color:var(--ink); }
.note.prior { padding:4px 7px 2px; border-bottom:1px solid var(--rule); margin-bottom:4px; }
.prior-v { color:var(--mark); font-variant-numeric:tabular-nums; }

/* play frames */
.frame { display:grid; grid-template-columns:auto 1fr; gap:6px 8px; align-items:center; padding:2px 6px; border-radius:2px; font-size:12px; }
.frame .tx { color:var(--ink-dim); }
.frame.enter .tx, .frame.leave .tx, .frame.iter .tx, .frame.branch .tx { color:var(--mark); }
.frame.refused .tx { color:var(--refuse); }
.frame.push .tx { color:var(--blue); }
.frame .stk { grid-column:2; }
.frame.l1 { margin-left:14px; } .frame.l2 { margin-left:28px; } .frame.l3 { margin-left:42px; } .frame.l4 { margin-left:56px; }
.step { padding:4px 8px; border:1px solid var(--rule); border-left:3px solid var(--rule); border-radius:2px; background:var(--raise); margin-bottom:3px; cursor:pointer; display:flex; gap:8px; align-items:baseline; }
.step.cur { border-left-color:var(--gold); background:color-mix(in srgb,var(--gold) 8%,var(--raise)); }
.step .i { font-size:10px; color:var(--ink-dim); min-width:22px; }
.step .op { font-weight:500; }
.step .runs { margin-left:auto; font-size:10px; color:var(--mark); }
.step.refused { border-left-color:var(--refuse); }

/* program anatomy */
.qnode { margin:2px 0 2px 0; border-left:2px solid color-mix(in srgb,var(--mark) 45%,transparent); padding-left:6px; }
.qnode.focus { border-left-color:var(--gold); background:color-mix(in srgb,var(--gold) 6%,transparent); border-radius:2px; }
.qnode > .qhead { display:flex; align-items:baseline; gap:6px; cursor:pointer; padding:2px 4px; font-size:12px; }
.qnode > .qhead .br { color:var(--mark); font-weight:600; }
.qnode > .qhead .role { font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--mark); }
.qnode > .qhead .runs { margin-left:auto; font-size:10px; color:var(--ink-dim); }
.qnode > .qtail { color:var(--mark); font-weight:600; padding:0 4px; font-size:12px; }
.leaf { display:flex; gap:8px; align-items:baseline; padding:1px 4px; border-radius:2px; cursor:pointer; font-size:12.5px; }
.leaf .i { font-size:10px; color:var(--ink-ghost); min-width:20px; }
.leaf.cur { background:color-mix(in srgb,var(--gold) 22%,transparent); }
.leaf.done { opacity:.55; }
.leaf.refused { color:var(--refuse); }
.leaf .runs { margin-left:auto; font-size:10px; color:var(--mark); }
.exrow.call { grid-template-columns:auto 1fr auto 1fr; }
.exrow.call .n { color:var(--mark); min-width:0; font-size:10px; letter-spacing:.04em; text-transform:uppercase; }

/* map */
.map { width:100%; height:190px; border:1px solid var(--rule); border-radius:2px; background:var(--well); }
.map .pt { transition:cx .25s ease, cy .25s ease; }

.keys { padding:7px 18px; border-top:1px solid var(--rule); background:var(--panel);
  display:flex; gap:14px; flex-wrap:wrap; align-items:center; font-size:11px; color:var(--ink-dim); }
.keys kbd { font-family:inherit; font-size:11px; padding:1px 5px; margin-right:4px;
  border:1px solid var(--rule); border-bottom-width:2px; border-radius:3px; background:var(--raise); color:var(--ink); }
.overlay { position:fixed; inset:0; background:color-mix(in srgb,var(--ground) 82%,transparent);
  display:flex; align-items:center; justify-content:center; padding:28px; z-index:10; }
.overlay .sheet { max-width:960px; max-height:88vh; overflow-y:auto; background:var(--panel);
  border:1px solid var(--rule); border-radius:3px; padding:22px 26px 24px; box-shadow:0 8px 40px rgba(0,0,0,.18); }
.overlay h3 { margin:16px 0 8px; font-family:"Instrument Serif",Georgia,serif; font-weight:400; font-size:20px; }
.overlay h3:first-child { margin-top:0; }
.overlay p { margin:5px 0; font-size:12.5px; color:var(--ink-dim); line-height:1.55; }
.overlay b { color:var(--ink); }
.overlay .cols { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:16px; }
.overlay .cols .label { display:block; margin-bottom:3px; }
.spin { color:var(--gold); }
.err { color:var(--refuse); }
</style>
</head>
<body>
<div class="machine">
  <div class="plate">
    <span class="name">Watch the stack solver think</span>
    <span class="sub" id="taskline">loading…</span>
    <div class="readouts">
      <div class="readout depth"><span class="label">depth</span><span class="v" id="r-depth">–</span></div>
      <div class="readout exec"><span class="label">executions</span><span class="v" id="r-exec">–</span></div>
      <div class="readout"><span class="label">beam</span><span class="v" id="r-beam">–</span></div>
      <span class="badge" id="r-term">–</span>
      <span class="badge" id="r-mode">replay</span>
    </div>
  </div>

  <div class="strip">
    <div class="cellrow"><span class="label">behaviour</span><span class="v" id="behaviour"></span></div>
    <div class="right">
      <div class="cellrow"><span class="label">witness</span><span class="v prog" id="witness"></span></div>
      <div class="cellrow"><span class="label">found</span><span class="v prog" id="found"></span></div>
    </div>
    <div class="examples" id="examples"></div>
  </div>

  <div class="alive" id="alive"></div>
  <div class="story" id="story"></div>

  <div class="bench">
    <div class="col">
      <div class="head"><span class="label" id="beam-title">beam · 1–9 , .</span><span class="sub" id="beam-sub"></span></div>
      <div class="body" id="beam"></div>
    </div>
    <div class="col">
      <div class="head"><span class="label" id="exp-title">ops tried · ↑ ↓</span><span class="sub" id="exp-sub"></span></div>
      <div class="body" id="tape"></div>
    </div>
    <div class="col">
      <div class="head"><span class="label" id="insp-title">node</span><span class="sub" id="insp-sub"></span></div>
      <div class="body" id="insp"></div>
    </div>
  </div>

  <div class="keys" id="keys"></div>
</div>
<div class="overlay" id="help" hidden></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const DRIVE_KEYS = ["a","s","d","f","g","h","j","k","l"];
const S = {
  session: null, depth: 0, node: 0, cursor: 0,
  mode: "replay", panel: "actions",
  showWitness: true, showRefused: false, playing: false, timer: null,
  drive: null, driveHistory: [], driveStates: [], play: null, playStep: 0, playFocus: null,
  state: null, error: null, help: false,
};
const fmt = (x, n = 2) => (x === null || x === undefined) ? "–" : Number(x).toFixed(n);
const pct = (x) => (x === null || x === undefined) ? "–" : (100 * x).toFixed(1) + "%";
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const layers = () => S.session ? S.session.trace.layers : [];
const layer = () => layers()[S.depth] || null;
const ops = () => S.session ? S.session.trace.ops : [];
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);

// ---------------------------------------------------------------------------
// deep link
function params() {
  const q = new URLSearchParams(location.search);
  const out = {};
  for (const key of ["task","behaviour","bucket","cohort_only","seed","beam_width","max_depth","guard","budget"]) {
    if (q.has(key)) out[key] = q.get(key);
  }
  return out;
}
function syncURL() {
  if (!S.session) return;
  const q = new URLSearchParams();
  q.set("task", S.session.task.index);
  const s = S.session.settings;
  q.set("beam_width", s.beam_width); q.set("max_depth", s.max_depth); q.set("guard", s.guard);
  if (s.budget !== null) q.set("budget", s.budget);
  history.replaceState(null, "", "?" + q.toString());
}
async function api(path, query) {
  const q = new URLSearchParams();
  for (const [k, v] of Object.entries(query || {})) if (v !== undefined && v !== null) q.set(k, v);
  const response = await fetch(path + (q.toString() ? "?" + q : ""));
  if (!response.ok) {
    let detail = response.statusText;
    try { detail = (await response.json()).detail || detail; } catch (e) {}
    throw new Error(detail);
  }
  return response.json();
}
async function loadSession(query) {
  S.error = null; S.session = null; S.mode = "replay"; S.play = null; S.drive = null; S.driveHistory = [];
  $("taskline").innerHTML = '<span class="spin">running the beam…</span>';
  render();
  try {
    const session = await api("/api/session", query);
    S.session = session; S.depth = 0; S.node = 0; S.cursor = 0; S.panel = "actions"; S.state = null;
    focusFirstExecuted();
    syncURL();
  } catch (error) {
    S.error = error.message;
  }
  render();
}

// ---------------------------------------------------------------------------
// stack parsing: the machine's own printing, read back into chips
function tokenize(text) { return text.match(/\(|\)|…|[^\s()]+/g) || []; }
function parseStack(text) {
  const tokens = tokenize(text);
  if (tokens[0] === "[") tokens.shift();
  if (tokens[tokens.length - 1] === "]") tokens.pop();
  const root = []; const stack = [root];
  for (const tk of tokens) {

}
function sectionHTML() {

function verdictBadge(e) {
  if (!e) return '<span class="oc cut">not tried</span>';
  if (e.outcome === "refused") return '<span class="oc refused">refused</span>';
  const v = e.verdict;
  if (v === "retained") return '<span class="oc retained">kept</span>';
  if (v === "fit") return '<span class="oc fit">fit ✓</span>';
  if (v === "duplicate") return '<span class="oc duplicate">seen</span>';
  if (v && v.startsWith("guard")) return `<span class="oc guard">guard ${esc(v.slice(6))}</span>`;
  if (v === "cut") return '<span class="oc cut">cut</span>';
  return `<span class="oc ${e.outcome}">${e.outcome}</span>`;
}

function exampleRows(states, matches, diffFrom) {
  const s = S.session;
  return states.map((text, i) => `<div class="exrow"><span class="n">ex ${i + 1}</span>${stackHTML(text, {match: matches ? matches[i] : undefined, diffFrom: diffFrom ? diffFrom[i] : undefined})}<span class="arrow">target</span>${stackHTML(s.task.outputs[i], {compact:true})}</div>`).join("");
}
function actionBars(entries, pickedName, witnessName) {
  const shown = entries.filter((e) => S.showRefused || e.probability !== null);
  const top = Math.max(1e-9, ...shown.map((e) => e.probability || 0));
  return shown.map((entry, index) => {
    const p = entry.probability || 0;
    const width = 100 * p / top;
    const key = entry.rank && entry.rank <= 9 && S.mode === "drive" ? `<span class="keycap">${DRIVE_KEYS[entry.rank - 1]}</span>` : "";
    const cls = "bar" + (entry.probability === null ? " refused" : "") + (entry.op === pickedName ? " picked" : "") + (witnessName && entry.op === witnessName ? " witness" : "");
    return `<div class="${cls}" data-op="${esc(entry.op)}"><div class="track"><div class="fill" style="width:${width}%"></div><span class="nm">${key}${esc(entry.op)}${entry.op === pickedName ? '<span class="tried">at cursor</span>' : ""}${witnessName && entry.op === witnessName ? '<span class="gt">witness next</span>' : ""}</span></div><span class="pc">${entry.probability === null ? "masked" : pct(entry.probability)}</span></div>`;
  }).join("");
}
function witnessLine(entries, witnessName) {
  if (!witnessName) return "";
  const at = entries.findIndex((e) => e.op === witnessName);
  const legal = entries.filter((e) => e.probability !== null).length;
  if (at < 0 || entries[at].probability === null) return `<div class="gtline">witness next: <b>${esc(witnessName)}</b> — refused here</div>`;
  return `<div class="gtline">witness next: <b>${esc(witnessName)}</b>, ranked <b>${entries[at].rank}</b> of ${legal} at ${pct(entries[at].probability)}</div>`;
}

function encodingHTML(enc) {

function mapSVG() {
  const map = S.session.map;
  if (!map || !map.points.length) return '<div class="note">no map</div>';
  const points = map.points;
  const xs = points.map((p) => p.x), ys = points.map((p) => p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const spanX = (maxX - minX) || 1, spanY = (maxY - minY) || 1;
  const sx = (x) => 16 + 268 * (x - minX) / spanX, sy = (y) => 168 - 146 * (y - minY) / spanY;
  const depth = layer().depth;
  const dots = points.map((p) => {
    if (p.kind === "start") return `<circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="4" fill="var(--ink)"><title>start</title></circle>`;
    if (p.kind === "target") return `<circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="6" fill="none" stroke="var(--gold)" stroke-width="2"><title>target</title></circle>`;
    // Retained at layer d are the nodes of layer d+1.
    const isCurrentLayer = p.depth === depth - 1;
    const isSel = isCurrentLayer && p.rank === S.node;
    const faded = p.depth >= depth;
    return `<circle class="pt" cx="${sx(p.x)}" cy="${sy(p.y)}" r="${isSel ? 4.5 : 2.4}" fill="${isSel ? "var(--gold)" : (isCurrentLayer ? "var(--blue)" : "var(--ink-ghost)")}" opacity="${faded ? .18 : (isCurrentLayer ? .95 : .5)}"><title>depth ${p.depth + 1} rank ${p.rank + 1}: ${esc(p.program.join(" "))} · dist ${p.distance_to_target}</title></circle>`;
  });
  const [a, b] = map.explained_variance;
  return `<svg class="map" viewBox="0 0 300 190"><text x="8" y="14" font-size="9" fill="var(--ink-dim)">PCA of retained nodes · ${pct(a)} + ${pct(b)} of variance · ring = solved</text>${dots.join("")}</svg>`;
}
function progressSVG(progress) {
  if (!progress || !progress.points.length) return "";
  const points = progress.points;
  const offAxis = Math.max(0.35, ...points.map((p) => Math.abs(p.y)));
  const sx = (x) => 30 + 240 * Math.max(-0.05, Math.min(1.12, x)) / 1.12, sy = (y) => 165 - 120 * (y / offAxis);
  const line = points.map((p, i) => `${i ? "L" : "M"}${sx(p.x)},${sy(p.y)}`).join(" ");
  const dots = points.map((p, i) => `<circle class="pt" cx="${sx(p.x)}" cy="${sy(p.y)}" r="${i === points.length - 1 ? 4.5 : 2.5}" fill="${i === points.length - 1 ? "var(--gold)" : "var(--ink-ghost)"}"><title>step ${i}: x ${p.x}, dist ${p.distance_to_target}</title></circle>`);
  return `<svg class="map" viewBox="0 0 300 190"><line x1="${sx(0)}" y1="165" x2="${sx(1)}" y2="165" stroke="var(--rule)"/><circle cx="${sx(1)}" cy="165" r="6" fill="none" stroke="var(--gold)" stroke-width="2"/><text x="${sx(0) - 4}" y="180" font-size="9" fill="var(--ink-dim)">input</text><text x="${sx(1) - 14}" y="180" font-size="9" fill="var(--ink-dim)">solved</text><path d="${line}" fill="none" stroke="var(--blue)" stroke-width="1.2" opacity=".7"/>${dots.join("")}</svg>`;
}

<div><span class="label">replay</span><p><b>↑ ↓</b> walk the 28 ops tried on the selected node, across nodes and depths. <b>→</b> follows the op at the cursor deeper, into the node it produced, when the search kept it; <b>←</b> goes back to the node and op that produced the selected node. <b>1–9 , .</b> select a node; <b>g</b> jumps to the witness node at this depth, cursor on the witness's next op. The alive strip is clickable for a plain jump to a depth. <b>space</b> runs. <b>t</b> toggles the witness marks; <b>x</b> shows masked ops in the ranking; <b>v</b> fetches the raw logits; <b>e</b> shows the exact tokens the model saw.</p></div>
<div><span class="label">drive</span><p>The line above the table is the <b>train prior</b>: how often each op follows the previous op in the train witnesses, at top level or inside an open quotation, and each row shows the policy's probability then the prior's in purple. Where they agree the policy may be repeating the corpus; where they differ it has read something off the state or the target. <b>m</b> takes the selected node's program and lets you continue by hand. <b>a s d f g h j k l</b> apply the policy's rank 1–9; <b>↑ ↓</b> pick any op and <b>→</b> or <b>Enter</b> applies it, refused ones excepted; <b>←</b> or <b>w</b> undoes. Every state shows all k examples and the policy's ranking from there.</p></div>
<div><span class="label">play</span><p><b>p</b> steps the authored witness through the machine, <b>o</b> the program the search found. Ops that run a quotation (i, dip, map, filter, fold, ifte) open up in the middle column: each element visited, each branch taken, each leaf op applied, on the first example. The left column is the program's own tree: each <b>[ … ]</b> is a section labelled with the role the machine ran it in (fold body, ifte condition, map body…) and how many times; the right column shows that section's input → output rows across every shown example. Stepping onto a combinator focuses the section it consumes; <b>b</b> cycles sections.</p></div>
</div>
<h3>Verdicts on the tape</h3>
<p><b>refused</b> — the machine's guard said no on some example (the reason is shown). <b>captured</b> — inside an open [, the op became a symbol. <b>kept</b> — in the next beam, at the rank shown. <b>seen</b> — a state the search already had. <b>guard close</b> — more open [ than ops left; <b>guard type</b> — the open body can never run (prune-open-mark-states, #70). <b>cut</b> — ranked below the 64th successor. <b>fit</b> — every shown target matched.</p>
<h3>The witness</h3>
<p>The authored program is ground truth only along its own path. Where a beam node is on it, its next op is marked and its rank in the policy's ordering is shown; the strip above says at which depth the beam last held the witness prefix. Off that path nothing is marked — from a state the witness never visits, no op is "correct".</p>
<p><b>?</b> or <b>esc</b> closes.</p></div>`;
}
function render() {
  renderHeader(); renderAlive(); renderStory(); renderBeam(); renderTape(); renderInspector(); renderKeys(); renderHelp();
}

// ---------------------------------------------------------------------------
// keys
document.addEventListener("keydown", (event) => {
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  const key = event.key;
  if (S.help) { if (key === "?" || key === "Escape") { S.help = false; render(); } return; }
  if (!S.session) return;
  if (key === "?") { S.help = true; render(); return; }
  if (key === "n") {
    const next = params(); delete next.task; delete next.seed;
    if (!next.behaviour && !next.bucket) next.cohort_only = "true";
    loadSession(next); return;
  }
  if (S.mode === "drive") {
    const rank = DRIVE_KEYS.indexOf(key.toLowerCase());
    if (rank >= 0) { driveApplyRank(rank + 1); return; }
    if (key === "ArrowUp") { event.preventDefault(); driveStep(-1); return; }
    if (key === "ArrowDown") { event.preventDefault(); driveStep(1); return; }
    if (key === "Enter" || key === "ArrowRight") { event.preventDefault(); driveApplyCursor(); return; }
    if (key === "ArrowLeft") { event.preventDefault(); driveUndo(); return; }
    if (key === "w") { driveUndo(); return; }
    if (key === "m" || key === "Escape") { exitDrive(); return; }
    if (key === "e") { S.panel = S.panel === "encoding" ? "actions" : "encoding"; render(); return; }
    if (key === "x") { S.showRefused = !S.showRefused; render(); return; }
    if (key === "t") { S.showWitness = !S.showWitness; render(); return; }
    return;
  }
  if (S.mode === "play") {
    if (key === "b") { cycleFocus(); return; }
    if (key === "ArrowLeft" || key === "ArrowUp") { event.preventDefault(); playStep(-1); return; }
    if (key === "ArrowRight" || key === "ArrowDown") { event.preventDefault(); playStep(1); return; }
    if (key === "m" || key === "Escape") { exitPlay(); return; }
    if (key === "p") { enterPlay("witness"); return; }
    if (key === "o") { enterPlay("found"); return; }
    return;
  }
  // The ops are listed vertically, so ↑ ↓ move through them; → goes deeper
  // into the search by following the op at the cursor, ← comes back up.
  if (key === "ArrowUp") { event.preventDefault(); stepCursor(-1); return; }
  if (key === "ArrowDown") { event.preventDefault(); stepCursor(1); return; }
  if (key === "ArrowLeft") { event.preventDefault(); ascend(); return; }
  if (key === "ArrowRight") { event.preventDefault(); descend(); return; }
  if (key === "g") { gotoWitness(); return; }
  if (key >= "1" && key <= "9") { focusNode(Number(key) - 1); return; }
  if (key === ",") { focusNode(S.node - 1); return; }
  if (key === ".") { focusNode(S.node + 1); return; }
  if (key === " ") { event.preventDefault(); play(); return; }
  if (key === "r") { reset(); return; }
  if (key === "t") { S.showWitness = !S.showWitness; render(); return; }
  if (key === "x") { S.showRefused = !S.showRefused; render(); return; }
  if (key === "v") { openPanel("logits"); return; }
  if (key === "e") { openPanel("encoding"); return; }
  if (key === "m") { enterDrive(); return; }
  if (key === "p") { enterPlay("witness"); return; }
  if (key === "o") { enterPlay("found"); return; }
});

(function boot() {
  const query = params();
  if (!query.task && !query.behaviour && !query.bucket && !query.seed) query.cohort_only = "true";
  loadSession(query);
})();
</script>
